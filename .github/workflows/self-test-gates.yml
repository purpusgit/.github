name: Self-CI — Gate Predicate Fixture Suite

# Task 5 of the Rules-to-Gates canonicalisation spec. Until now purpusgit/.github
# had no CI on itself: seven (now eight) reusable gates, called `@main` by every
# consumer repo, validated by nothing (PR #15 returned zero check runs). A gate
# whose predicate silently breaks would fail open across the org. This workflow
# runs scripts/gate_selftest.py, which extracts each gate's live `run:` predicate,
# syntax-checks it, and runs the self-contained ones against pass/fail fixtures.
# It goes RED if any predicate breaks or stops catching its violation.
#
# NOTE for future edits: prove red-detection with the in-harness canary and the
# offline fixtures — NEVER by pushing a deliberately-broken predicate to a real
# gate on main. Consumer repos resolve these workflows `@main`, so a deliberate
# break here is an org-wide CI outage, not a local test.

on:
  push:
    paths:
      - '.github/workflows/**'
      - 'scripts/**'
      - 'taxo-contract/**'
  pull_request:
    paths:
      - '.github/workflows/**'
      - 'scripts/**'
      - 'taxo-contract/**'
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  gate-selftest:
    runs-on: ubuntu-latest
    name: Exercise every reusable gate predicate
    steps:
      - uses: actions/checkout@v5.1.0
      - uses: actions/setup-python@v6.3.0
        with:
          python-version: "3.11"
      - name: Install deps
        run: pip install pyyaml jsonschema
      - name: Run gate self-test
        run: python3 scripts/gate_selftest.py
      - name: Run taxo-contract checker self-test (block-scoped 2.2)
        run: python3 taxo-contract/test_checker.py
      - name: Run taxo_lint scan-scope self-test (glob broadening + template scoping)
        run: python3 scripts/test_taxo_lint.py
