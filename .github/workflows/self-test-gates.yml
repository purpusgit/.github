name: Self-CI — Gate Predicate Fixture Suite

# Task 5 of the Rules-to-Gates canonicalisation spec. Until now purpusgit/.github
# had no CI on itself: seven (now eight) reusable gates, called `@main` by every
# consumer repo, validated by nothing (PR #15 returned zero check runs). A gate
# whose predicate silently breaks would fail open across the org. This workflow
# runs scripts/gate_selftest.py, which extracts each gate's live `run:` predicate,
# syntax-checks it, and runs the self-contained ones against pass/fail fixtures.
# It goes RED if any predicate breaks or stops catching its violation.
#
# NOTE for future edits: prove red-detection with the in-harness canary and the
# offline fixtures — NEVER by pushing a deliberately-broken predicate to a real
# gate on main. Consumer repos resolve these workflows `@main`, so a deliberate
# break here is an org-wide CI outage, not a local test.
#
# Why this job installs Flutter and Node: reusable-flutter-analyze and
# reusable-tsc-check each have exactly one self-contained predicate
# (`flutter analyze lib/`, `tsc --noEmit`). Without the toolchains those two
# gates could only ever be syntax-checked, i.e. never proven to go red. The SDK
# setup is the price of a behavioural assertion on them; it buys nothing else.

on:
  # ── push: paths-filtered, deliberately ──────────────────────────────────────
  # A push to `main` genuinely only matters for these paths, and keeping the
  # filter here caps the cost of the Flutter+Node install below. A push trigger
  # carries no obligation to report a status on anything.
  #
  # `.github/actions/auth-coverage/**` is here because that predicate and its
  # DEFECT battery are now exercised by this job; without it a push changing only
  # the predicate runs nothing on `main`. Scoped to that ONE action rather than
  # `.github/actions/**`: the sibling `flutter-test` action is not exercised here,
  # so a push touching it would buy a 95-second Flutter-installing job that
  # verifies nothing about it — against a filter whose whole purpose is capping
  # that cost. Widen this the day this job starts exercising another action.
  push:
    paths:
      - '.github/workflows/**'
      - '.github/actions/auth-coverage/**'
      - 'scripts/**'
      - 'taxo-contract/**'

  # ── pull_request: NO paths filter. This is load-bearing. ────────────────────
  # This job's check run is a REQUIRED CONTEXT on `main`. A required check that
  # is SKIPPED never reports, and GitHub then blocks the PR forever on
  # "Expected — waiting for status".
  #
  # With a paths filter here, a docs-only PR — a README edit, a rollout-doc
  # change, anything outside the three globs above — would skip this workflow
  # and deadlock. That failure is an ABSENCE, not a red: nothing fails, nothing
  # is logged, and it is invisible to every check that looks for failures. The
  # org has already paid a week of a blocked incident-fix queue for exactly this
  # (japa, 2026-08-02), and an org-wide audit a week later still found one
  # survivor.
  #
  # ⛔ DO NOT ADD A `paths:` FILTER HERE while this context is required.
  #    Governed by M43 — git_workflow_guidelines.md.
  pull_request:

  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  gate-selftest:
    runs-on: ubuntu-latest
    # ⚠️ This job `name:` IS the required status-check context. Renaming it
    # breaks branch protection on `main`. If it must ever change, rename the
    # required context FIRST, observe the new name reporting on a real PR head,
    # and only then rename here (M43 — context and reporter move together).
    name: Exercise every reusable gate predicate
    steps:
      - uses: actions/checkout@v5.1.0
      - uses: actions/setup-python@v6.3.0
        with:
          python-version: "3.11"
      # Toolchains for the two behavioural fixtures added 2026-08-02.
      # No version file is pinned on purpose: the fixtures assert on analyzer /
      # tsc DIAGNOSTICS, not on SDK-version-specific output, so tracking stable
      # is what we want — if a future SDK stops reporting `unused_element` as a
      # warning, this harness should red and tell us.
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install deps
        run: pip install pyyaml jsonschema
      # actionlint parses GitHub's own expression grammar — the one defect class
      # neither `yaml.safe_load` nor `bash -n` can see (notify-host-tip-moved.yml,
      # 2026-08-10: a literal empty `${{ }}` in a run: comment made Actions reject
      # 13 workflows at validation time, silently). Deliberately a STEP in this
      # job, not a job of its own: Actions bills per job rounded UP to a whole
      # minute, so an ~11s second job costs a full billed minute to run a linter
      # that adds ~1s here.
      #
      # Version PINNED, and checksum-verified: a linter that changes its rules
      # under us reds this harness for something no PR introduced, and this binary
      # is executed, so it gets the same treatment as any other executable
      # dependency. `set -euo pipefail` means a failed download or a checksum
      # mismatch reds the step — gate_selftest.py then reds a second time on
      # `shutil.which("actionlint")`. Fail-closed twice; an absent check is the
      # exact failure mode this gate exists to prevent.
      - name: Install actionlint (pinned)
        env:
          ACTIONLINT_VERSION: "1.7.7"
          ACTIONLINT_SHA256: "023070a287cd8cccd71515fedc843f1985bf96c436b7effaecce67290e7e0757"
        run: |
          set -euo pipefail
          curl -fsSL -o "$RUNNER_TEMP/actionlint.tgz" \
            "https://github.com/rhysd/actionlint/releases/download/v${ACTIONLINT_VERSION}/actionlint_${ACTIONLINT_VERSION}_linux_amd64.tar.gz"
          echo "${ACTIONLINT_SHA256}  $RUNNER_TEMP/actionlint.tgz" | sha256sum -c -
          tar -xzf "$RUNNER_TEMP/actionlint.tgz" -C "$RUNNER_TEMP" actionlint
          echo "$RUNNER_TEMP" >> "$GITHUB_PATH"
          "$RUNNER_TEMP/actionlint" --version
      - name: Run gate self-test
        run: python3 scripts/gate_selftest.py
      # ⛔ THE AUTH-COVERAGE BATTERY RAN NOWHERE IN THIS REPOSITORY UNTIL THIS STEP.
      # `gate_selftest.py` contains ZERO occurrences of the string `selftest` — its
      # auth-coverage entries are the pass/fail fixture directory and
      # `canary_auth_coverage`. Those are complementary to this: they prove the
      # predicate still catches an ungated route and that the fixture genuinely
      # exercises it, while the numbered cases below cover the fifteen specific ways
      # this predicate has been wrong — the commented-out middleware, the group-5
      # offset arithmetic, the identifier splice, the zero-root floor, the
      # environment override that once let a pull request disarm the gate judging it.
      #
      # Those assertions had exactly one runner: `action.yml`'s "Predicate self-test"
      # step — which executes on CONSUMER repos. So a predicate change merged HERE
      # green (#77 and #80 both did), and the battery only spoke later, on the next
      # unrelated PR across nine services, where the red reads as their defect rather
      # than as the change that caused it. The verification was never missing; it
      # fired where the author could not see it and someone else paid.
      #
      # The script is cwd-independent by construction — `__dirname` for the
      # predicate, `os.tmpdir()` for its fixtures, an explicit `cwd` on every run —
      # so invoking it from the repository root is the same run `action.yml` gets.
      #
      # ⛔ AND THE COUNT IS CHECKED, because the battery itself has no floor.
      # `check-route-auth-coverage.selftest.js` ends `process.exit(failures ? 1 : 0)`
      # and prints "all self-tests passed" on zero failures — so a battery that ran
      # ZERO assertions, or one truncated halfway by an early throw, exits 0 and reads
      # as a pass. A checker that cannot tell "checked nothing" from "found nothing
      # wrong" is the precise defect every gate in this repository exists to remove,
      # and this step is what makes that battery a REQUIRED blocking context, so the
      # floor belongs here. Raise the number when you add a case; that is the point —
      # losing a case should cost an edit, not pass silently.
      - name: Run auth-coverage predicate self-test (DEFECT battery)
        env:
          EXPECTED_ASSERTIONS: "37"
        run: |
          set -uo pipefail
          rc=0
          out="$(node .github/actions/auth-coverage/check-route-auth-coverage.selftest.js)" || rc=$?
          printf '%s\n' "$out"
          n="$(printf '%s\n' "$out" | grep -c '^  ok   ' || true)"
          echo "assertions that passed: $n (expected $EXPECTED_ASSERTIONS)"
          if [ "$rc" -ne 0 ]; then
            echo "::error::auth-coverage battery reported failures (exit $rc)"
            exit "$rc"
          fi
          if [ "$n" -lt "$EXPECTED_ASSERTIONS" ]; then
            echo "::error::auth-coverage battery ran $n assertions, expected at least $EXPECTED_ASSERTIONS — cases were LOST, not passed. A battery that checked nothing exits 0 exactly like one that found nothing wrong."
            exit 1
          fi
      - name: Run taxo-contract checker self-test (block-scoped 2.2)
        run: python3 taxo-contract/test_checker.py
      - name: Run taxo_lint scan-scope self-test (glob broadening + template scoping)
        run: python3 scripts/test_taxo_lint.py
