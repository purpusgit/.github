name: Reusable — build and push image (S5)

# S5 spec-sandbox-image-availability.md section 3.2. Builds one image from one
# repo at a pinned commit and pushes it to GHCR under :sha-<sha>. Never pushes
# :latest. Runs only on ubuntu-latest (D12: never on an orbit-ci runner, so a
# host that holds the pull-token set never also holds build capability).

on:
  workflow_call:
    inputs:
      sha:
        description: "40-hex commit to build. Must be reachable from origin/<branch>."
        required: true
        type: string
      branch:
        description: "Integration branch sha must be an ancestor of (default branch for ops_mcp is main; sandbox for everything else)."
        required: false
        type: string
        default: sandbox
      context:
        description: "Docker build context, relative to repo root."
        required: true
        type: string
      dockerfile:
        description: "Dockerfile path, relative to repo root."
        required: true
        type: string
      base:
        description: "Optional semicolon-separated <FROM-ref>=<base>@sha256:<digest> entries, one per Dockerfile FROM. Empty = build with each FROM's tag as committed (no pin yet)."
        required: false
        type: string
        default: ""
      submodules:
        description: "Whether checkout should also fetch submodules."
        required: false
        type: boolean
        default: false
      image:
        description: "GHCR image name under ghcr.io/purpusgit/, e.g. service_orbit_analytics/exact-count-worker."
        required: true
        type: string
    outputs:
      digest:
        description: "The pushed image's content digest (sha256:...)."
        value: ${{ jobs.build.outputs.digest }}

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      digest: ${{ steps.push.outputs.digest }}
    steps:
      - name: Checkout at the pinned commit
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.sha }}
          fetch-depth: 0
          submodules: ${{ inputs.submodules }}

      # S5 S2.2 step 2: refuse a sha the integration branch has never seen.
      - name: Refuse unless sha is an ancestor of origin/${{ inputs.branch }}
        run: |
          set -euo pipefail
          git fetch origin "${{ inputs.branch }}" --quiet
          if ! git merge-base --is-ancestor "${{ inputs.sha }}" "origin/${{ inputs.branch }}"; then
            echo "::error::${{ inputs.sha }} is not reachable from origin/${{ inputs.branch }}"
            exit 1
          fi

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # Standard GHCR-from-Actions push credential: GITHUB_TOKEN scoped by the
      # job's own `packages: write` above. This is a PUSH credential, issued
      # fresh per run and never stored — separate from G4's GHCR_PULL_TOKEN,
      # which is a read:packages PAT the box uses to pull, not build.
      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build one --build-context flag per pinned FROM entry
        id: basectx
        run: |
          set -euo pipefail
          args=()
          IFS=';' read -ra entries <<< "${{ inputs.base }}"
          for entry in "${entries[@]}"; do
            [ -z "$entry" ] && continue
            args+=(--build-context "$entry")
          done
          {
            echo "args<<EOF_BASECTX"
            printf '%s\n' "${args[@]}"
            echo "EOF_BASECTX"
          } >> "$GITHUB_OUTPUT"

      - name: Build and push
        id: push
        run: |
          set -euo pipefail
          mapfile -t basectx_args <<< "${{ steps.basectx.outputs.args }}"
          docker buildx build \
            --platform linux/amd64 \
            -f "${{ inputs.dockerfile }}" \
            "${basectx_args[@]}" \
            --label org.opencontainers.image.revision="${{ inputs.sha }}" \
            --label org.opencontainers.image.source="https://github.com/${{ github.repository }}" \
            --tag "ghcr.io/purpusgit/${{ inputs.image }}:sha-${{ inputs.sha }}" \
            --push \
            --metadata-file /tmp/buildx-metadata.json \
            "${{ inputs.context }}"
          digest=$(python3 -c "import json;print(json.load(open('/tmp/buildx-metadata.json'))['containerimage.digest'])")
          echo "digest=$digest" >> "$GITHUB_OUTPUT"
          echo "### Built \`ghcr.io/purpusgit/${{ inputs.image }}:sha-${{ inputs.sha }}@${digest}\`" >> "$GITHUB_STEP_SUMMARY"

# Known gap, not built here (S5 section 2.3 "build.args with a value" rule):
# no repo in the current 13-image set passes a value-bearing --build-arg, so
# this template does not yet wire a --secret passthrough. The first repo that
# needs one should add it here, scoped to that input, not globally.
