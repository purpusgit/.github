name: Reusable — Flutter Colours Safety Gate

on:
  workflow_call:
    inputs:
      base_ref:
        description: 'Base branch to diff against'
        required: false
        type: string
        default: 'cwb'

jobs:
  colours-gate:
    name: "No hardcoded Colors.* additions (Rule 24)"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5.1.0
        with:
          fetch-depth: 0

      - name: Fetch base branch
        run: git fetch origin ${{ inputs.base_ref || 'cwb' }}

      - name: Check for hardcoded colour additions
        run: |
          set +e
          FAILED=0
          BASE_REF="${{ inputs.base_ref || 'cwb' }}"

          # Never pass vacuously. If the base ref cannot be resolved the diff below
          # comes back EMPTY and the gate printed "No lib/ Dart files changed. Gate
          # passed." — a silent pass on an uncomputable diff. Same guard shape as
          # reusable-sql-typestring-safety-gate.yml.
          if ! git rev-parse --verify --quiet "origin/${BASE_REF}" >/dev/null; then
            echo "::error::Colours gate could not resolve base ref origin/${BASE_REF} — refusing to pass without diffing."
            exit 1
          fi

          # Mask `//` line comments before matching. The gate used to match its own
          # trigger strings inside prose: pkg_new_social PR #174 had to reword an
          # accurate comment ("...instead of a raw Colors.green/grey.") for no reason
          # other than to stop the regex firing — zero lines of code changed. A gate
          # that rewards making comments less accurate is worse than no gate.
          #
          # Only an UNQUOTED `//` opens a comment. A `//` inside a string literal (a
          # URL, say) is left alone, so real code after it on the same line is still
          # scanned. `/* */` is deliberately NOT handled: same-line block comments are
          # the sanctioned `/* intentional: <reason> */` stamp form and must keep
          # working exactly as they do now. A quote left open at end of line (a
          # multi-line string) masks nothing, which is the pre-existing behaviour.
          # `if 1:` lets the whole script sit indented inside this YAML block scalar;
          # unindented lines would terminate the block. \x27 / \x22 are a quote and a
          # double quote, spelled that way so the script survives shell single-quoting.
          mask_comments() {
            python3 -c 'if 1:
              import sys
              for raw in sys.stdin:
                  s = raw.rstrip("\n")
                  q = ""
                  i = 0
                  while i < len(s):
                      c = s[i]
                      if q:
                          if c == "\\":
                              i += 2
                              continue
                          if c == q:
                              q = ""
                      elif c == "\x27" or c == "\x22":
                          q = c
                      elif c == "/" and s[i:i + 2] == "//":
                          s = s[:i]
                          break
                      i += 1
                  sys.stdout.write(s + "\n")
              '
          }

          # lib/ Dart files changed in this PR (diff-only; excludes test/ to avoid false positives)
          CHANGED=$(git diff "origin/${BASE_REF}...HEAD" --name-only -- '*.dart' 2>/dev/null | grep '^lib/')

          if [ -z "$CHANGED" ]; then
            echo "No lib/ Dart files changed. Gate passed."
            exit 0
          fi

          while IFS= read -r FILE; do
            # Skip deleted files
            [ -f "$FILE" ] || continue

            # Skip colour/theme definition files — these legitimately use Colors.*
            # Pattern covers: theme/ directories, filenames with color/colour/palette, orbit_colors.dart
            if echo "$FILE" | grep -qiE '(theme/|/colors?[_.]/|orbit_colors\.|_theme\.dart$|colors?\.dart$|colours?\.dart$)' ||                echo "$(basename "$FILE")" | grep -qiE '^(colors?|colours?|palette|.*_theme)\.dart$'; then
              echo "Skipping colour/theme file: $FILE"
              continue
            fi

            # B5b — file-level `fixed-stage` opt-out, SCOPED TO THE COLOUR-SOURCING
            # CHECKS ONLY: hex literals and `Colors.*`.
            # Some surfaces are a deliberately fixed dark stage that does not follow
            # the theme (chant session, PiP, calibration wizard, wake overlay, voice
            # lock, welcome screen). Their hex literals have no light-token match BY
            # DESIGN, so B5 forced them to be suppressed one line at a time — one repo
            # reached 505 `// intentional:` stamps, 415 of which suppressed nothing.
            #
            # `Colors.*` is the same statement in another spelling and honours the same
            # header. It did not, and that asymmetry cost pkg_new_social PR #174 sixty-
            # nine per-line `// intentional:` stamps layered ON TOP of a header that had
            # already declared the file a fixed stage. B5b bans exactly that pairing:
            # `// intentional:` is the suppression token, so a line carrying one is
            # exempt forever — including a future edit that pastes a genuinely wrong
            # colour onto it. One header, one decision, one thing to review.
            #
            # It must NOT skip the whole file. The first draft of this used `continue`,
            # which ALSO disabled the `.withOpacity(` and `extension<X>()!` checks —
            # and `extension<X>()!` is a null-assertion CRASH check with nothing to do
            # with B5. One comment line would have opted a file out of a runtime-safety
            # gate. A fixed stage is a statement about colour SOURCING, not a licence
            # to crash.
            FIXED_STAGE=0
            if head -20 "$FILE" | grep -qE '^[[:space:]]*//[[:space:]]*fixed-stage:'; then
              FIXED_STAGE=1
              echo "fixed-stage (B5b): $FILE - hex + Colors.* skipped; withOpacity, extension<>()! still enforced"
            fi

            # Added lines only — lines starting with + but not the +++ file header
            ADDED=$(git diff "origin/${BASE_REF}...HEAD" -- "$FILE" 2>/dev/null | grep '^+' | grep -v '^+++')

            # The matching surface for every arm below: added lines, minus the ones
            # carrying an `intentional:` stamp, with `//` comments masked.
            # The `intentional:` filter runs FIRST and on the RAW line, exactly as each
            # arm ran it before — masking first would have stripped trailing
            # `// intentional: <reason>` stamps and turned them into new failures.
            ADDED_CODE=$(echo "$ADDED" | grep -v 'intentional:' | mask_comments)

            # Block any Colors.* except Colors.transparent
            # Uses perl negative lookbehind (?<![a-zA-Z]) to avoid false-positives like gradientColors.map
            # and negative lookahead (?!transparent) so Colors.transparent is permitted on the same line
            # Also exclude constructor default parameters (this.<param> = Colors.<X>)
            # BuildContext is unavailable at class-scope defaults — colorScheme tokens cannot be used there.
            # Skipped entirely on a `fixed-stage` file (see B5b above).
            COLOR_HITS=""
            if [ "$FIXED_STAGE" -eq 0 ]; then
              COLOR_HITS=$(echo "$ADDED_CODE" | grep -vP '\bthis\.[a-zA-Z_][a-zA-Z0-9_]* = Colors\.' | perl -ne 'print if /(?<![a-zA-Z])Colors\.(?!transparent\b)[a-zA-Z]/')
            fi

            if [ -n "$COLOR_HITS" ]; then
              echo ""
              echo "::error file=$FILE::Hardcoded Colors.* added — use semantic colour tokens instead."
              echo "  Fix options:"
              echo "    Success / verified / approved -> (Theme.of(context).extension<OrbitColors>())?.statusPositive ?? colorScheme.primary"
              echo "    Error / danger               -> colorScheme.error"
              echo "    Primary brand                -> colorScheme.primary"
              echo "    WhatsApp brand               -> (Theme.of(context).extension<OrbitColors>())?.brandWhatsapp ?? colorScheme.secondary"
              echo "    Whole surface ignores theme  -> declare '// fixed-stage: <why>' in the file header"
              echo "    Suppress (last resort)       -> add '// intentional: <reason>' on the same line"
              echo ""
              echo "$COLOR_HITS" | head -10
              FAILED=1
            fi

            # Block deprecated .withOpacity(); use .withValues(alpha:) — Flutter 3.27+
            OPACITY_HITS=$(echo "$ADDED_CODE" | grep '\.withOpacity(')

            if [ -n "$OPACITY_HITS" ]; then
              echo ""
              echo "::error file=$FILE::Deprecated .withOpacity() added — use .withValues(alpha: x) instead (Flutter 3.27+)."
              echo "$OPACITY_HITS" | head -5
              FAILED=1
            fi


            # Block non-null extension<X>()! assertions — crashes if host theme doesn't provide the extension
            # (Dark_Mode_Architecture.md §17)
            EXTENSION_BANG=$(echo "$ADDED_CODE" | grep 'extension<' | grep ')!')

            if [ -n "$EXTENSION_BANG" ]; then
              echo ""
              echo "::error file=$FILE::Non-null extension<X>()! added — use nullable pattern: extension<X>()?.field ?? colorScheme.fallback (Dark_Mode_Architecture.md §17)."
              echo "  Fix: final oc = Theme.of(context).extension<OrbitColors>();"
              echo "       final color = oc?.statusPositive ?? colorScheme.primary;"
              echo "$EXTENSION_BANG" | head -5
              FAILED=1
            fi


            # B5 — hex literals at call sites. WARNING ONLY for now.
            # B5 says call sites use tokens; hex is permitted only in the central
            # theme files (already skipped above). Nothing has ever enforced this,
            # which is how 583 call-site literals shipped in pkg_orbit_japa.
            # Deliberately non-failing on introduction: flipping it to an error
            # before every repo has its `fixed-stage` declarations in place would
            # red-wall unrelated PRs. Promote to FAILED=1 once those have landed.
            # {6,8} also matched 7 digits, which is not a valid Dart literal.
            # Color.fromARGB(...) is the same defect in another spelling and was missed
            # entirely - example/lib/main.dart already uses it.
            HEX_HITS=""
            if [ "$FIXED_STAGE" -eq 0 ]; then
              HEX_HITS=$(echo "$ADDED_CODE" | grep -oP 'Color\(0x(?:[0-9a-fA-F]{8}|[0-9a-fA-F]{6})\)|Color\.fromARGB\(' | head -10)
            fi
            if [ -n "$HEX_HITS" ]; then
              echo ""
              echo "::warning file=$FILE::B5 — hex colour literal added at a call site. Use a semantic token, or declare the file '// fixed-stage: <why>' if this surface deliberately ignores the theme."
              echo "$HEX_HITS"
            fi

          done <<< "$CHANGED"

          if [ $FAILED -eq 1 ]; then
            echo ""
            echo "Gate: Flutter Colours Safety (Rule 24)"
            echo "See: Dark_Mode_Architecture.md and Cross_Flavor_Shared_Widgets_Rules.md"
            exit 1
          fi

          echo "Flutter colours safety gate passed."
