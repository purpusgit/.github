name: Reusable — SQL Template Literal Safety Gate

on:
  workflow_call:
    inputs:
      guard_workflows:
        description: >-
          Space-separated workflow files in the CALLING repo that back a required status
          check and must therefore never carry a trigger filter. Defaults to the caller
          file for this gate. Repos with more required contexts pass more paths.
        required: false
        type: string
        default: .github/workflows/sql-safety-gate.yml

jobs:
  sql-safety-gate:
    runs-on: ubuntu-latest
    name: SQL stray-semicolon check
    steps:
      - uses: actions/checkout@v5.1.0

      # Rides inside this already-required context on purpose: it costs no new required
      # status check in any consumer, and it fails LOUDLY (a red you can clear) instead
      # of silently (a missing check you cannot).
      #
      # Ported from service_org_broadcast's tsc_check.yml, which has run this guard
      # locally since PR #150. It lives here as well because five consumers
      # (bc_shared_contracts, inapp-chat-contracts, service_AI_ML,
      # service_marketplace_odoo, service_mongo_admin) require ONLY this context and have
      # no local job to host a guard step — the only place that reaches them is the
      # reusable they already call.
      - name: Guard - required-check workflows must not be trigger-filtered
        shell: bash
        run: |
          set -uo pipefail
          fail=0
          for f in ${{ inputs.guard_workflows }}; do
            if [ ! -f "$f" ]; then
              echo "::error file=$f::Guarded workflow is missing. Either it was renamed without updating guard_workflows, or a required context has lost its reporter."
              fail=1
              continue
            fi
            block=$(awk '/^on:/{inb=1;next} inb && /^[^[:space:]#]/{inb=0} inb' "$f")
            echo "$block" | grep -qE '^[[:space:]]*(paths|paths-ignore|branches|branches-ignore):'
            rc=$?
            case $rc in
              0) echo "::error file=$f::Required-check workflow has a trigger filter in its 'on:' block. A required check must never be paths- or branches-filtered: when the filter misses it does not report 'skipped', it does not report AT ALL, and branch protection blocks on the ABSENCE. Filter inside the job instead."
                 echo "$block" | grep -nE '^[[:space:]]*(paths|paths-ignore|branches|branches-ignore):'
                 fail=1 ;;
              1) : ;;
              *) echo "::error file=$f::grep exited $rc while scanning the on: block - treating as FAIL rather than assuming clean."
                 fail=1 ;;
            esac
          done
          exit $fail
      - name: Check for stray semicolons in SQL template literals
        run: |
          python3 - <<'PYEOF'
          import re, glob, sys

          errors = []
          # Match both plain (foo.sql.ts) and versioned (foo.sql.v1.ts /
          # foo.sql.v2.ts) SQL template files. Versioned files were previously
          # skipped by the bare *.sql.ts glob (Rule 86 CI-gate fix).
          files = sorted(set(
              glob.glob('src/**/*.sql.ts', recursive=True)
              + glob.glob('src/**/*.sql.v[0-9]*.ts', recursive=True)
          ))
          for path in files:
              try:
                  content = open(path, encoding='utf-8', errors='replace').read()
              except Exception as e:
                  print(f'Warning: could not read {path}: {e}')
                  continue
              stripped = re.sub(r'--[^\n]*', '', content)
              for m in re.finditer(r';\s*\n[ \t]+(AND|OR|GROUP BY|ORDER BY|HAVING|LIMIT)', stripped):
                  line_no = stripped[:m.start()].count('\n') + 1
                  errors.append(f'{path}:{line_no}: stray ; before SQL continuation ({m.group(1).strip()})')

          if errors:
              print('ERROR: SQL template literal safety gate FAILED')
              print('Stray semicolons found inside pool.query() template literals.')
              print('These cause MySQL error 1064 at runtime (tsc/CI cannot detect them):')
              for e in errors:
                  print(f'  {e}')
              print()
              print('Fix: remove the trailing semicolon from the WHERE condition line.')
              print('See: TypeScript_Backend_Coding_Rules.md §SQL Template Literal Discipline')
              sys.exit(1)

          print(f'SQL template literal safety gate passed — {len(files)} .sql.ts files scanned, 0 issues.')
          PYEOF
