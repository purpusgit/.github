name: Reusable — SQL Template Literal Safety Gate

on:
  workflow_call:
    inputs:
      guard_workflows:
        description: >-
          Space-separated workflow files in the CALLING repo that back a required status
          check and must therefore never carry a trigger filter. Defaults to the caller
          file for this gate. Repos with more required contexts pass more paths.
        required: false
        type: string
        default: .github/workflows/sql-safety-gate.yml
      code_root:
        description: >-
          Directory under the caller repo to scan for *.sql.ts / *.sql.v[0-9]*.ts.
          Defaults to `src`, which is where every caller's TypeScript lived when this
          gate was written.

          A monorepo whose sources sit under workspace packages
          (packages/server/src, packages/services/*/src) must pass the directory that
          CONTAINS them — `packages` — because the scan is ROOTED here, not discovered.
          Getting it wrong is SILENT: the glob matches nothing, no violation is found,
          and the gate reports the same green as a repo that genuinely passed. The
          summary line names the resolved root and the file count so that case is at
          least readable in the log.
        required: false
        type: string
        default: src

jobs:
  sql-safety-gate:
    runs-on: ubuntu-latest
    name: SQL stray-semicolon check
    steps:
      - uses: actions/checkout@v5.1.0

      # Rides inside this already-required context on purpose: it costs no new required
      # status check in any consumer, and it fails LOUDLY (a red you can clear) instead
      # of silently (a missing check you cannot).
      #
      # Ported from service_org_broadcast's tsc_check.yml, which has run this guard
      # locally since PR #150. It lives here as well because five consumers
      # (bc_shared_contracts, inapp-chat-contracts, service_AI_ML,
      # service_marketplace_odoo, service_mongo_admin) require ONLY this context and have
      # no local job to host a guard step — the only place that reaches them is the
      # reusable they already call.
      - name: Guard - required-check workflows must not be trigger-filtered
        shell: bash
        run: |
          set -uo pipefail
          fail=0
          for f in ${{ inputs.guard_workflows }}; do
            if [ ! -f "$f" ]; then
              echo "::error file=$f::Guarded workflow is missing. Either it was renamed without updating guard_workflows, or a required context has lost its reporter."
              fail=1
              continue
            fi
            block=$(awk '/^on:/{inb=1;next} inb && /^[^[:space:]#]/{inb=0} inb' "$f")
            # `|| rc=$?` is load-bearing, not style. GitHub runs `shell: bash` as
            # `bash --noprofile --norc -e -o pipefail`, and `set -uo pipefail` above does
            # NOT clear that inherited `-e`. A bare `grep -q` followed by `rc=$?` therefore
            # aborts the whole step the moment grep exits 1 -- which is the CLEAN case --
            # so the guard reported red on exactly the workflows it was meant to pass, while
            # the dirty case reddened via fail=1. It could not pass either way.
            # `||` suppresses `-e` for its left operand while preserving the exit code, so
            # the three-way `case` below (0 found / 1 clean / 2+ grep itself failed) keeps
            # the distinction that an `if` would collapse.
            rc=0
            echo "$block" | grep -qE '^[[:space:]]*(paths|paths-ignore|branches|branches-ignore):' || rc=$?
            case $rc in
              0) echo "::error file=$f::Required-check workflow has a trigger filter in its 'on:' block. A required check must never be paths- or branches-filtered: when the filter misses it does not report 'skipped', it does not report AT ALL, and branch protection blocks on the ABSENCE. Filter inside the job instead."
                 echo "$block" | grep -nE '^[[:space:]]*(paths|paths-ignore|branches|branches-ignore):'
                 fail=1 ;;
              1) : ;;
              *) echo "::error file=$f::grep exited $rc while scanning the on: block - treating as FAIL rather than assuming clean."
                 fail=1 ;;
            esac
          done
          exit $fail
      - name: Check for stray semicolons in SQL template literals
        run: |
          python3 - <<'PYEOF'
          import re, glob, sys

          # code_root is SPLICED into this body rather than passed through `env:`, and
          # that is deliberate. scripts/gate_selftest.py exercises this predicate offline
          # by reading the step's `run:` text and substituting the DECLARED input
          # defaults; it does not forward a step's `env:`. An env-borne value would be
          # invisible to the harness, so the fixture could only ever test the default —
          # i.e. exactly the path that already worked. Same mechanism
          # reusable-taxo-lint.yml uses for `code_dir`.
          #
          # The r'''...''' wrapper is also load-bearing: it keeps this line valid Python
          # BEFORE substitution, which is what lets the harness py_compile the raw
          # heredoc body.
          code_root = r'''${{ inputs.code_root }}'''.strip() or 'src'
          if not re.fullmatch(r'[A-Za-z0-9_][A-Za-z0-9_./-]*', code_root):
              print(f'ERROR: code_root {code_root!r} is not a plain relative path.')
              sys.exit(1)

          errors = []
          # Match both plain (foo.sql.ts) and versioned (foo.sql.v1.ts /
          # foo.sql.v2.ts) SQL template files. Versioned files were previously
          # skipped by the bare *.sql.ts glob (Rule 86 CI-gate fix).
          files = sorted(set(
              glob.glob(f'{code_root}/**/*.sql.ts', recursive=True)
              + glob.glob(f'{code_root}/**/*.sql.v[0-9]*.ts', recursive=True)
          ))
          for path in files:
              try:
                  content = open(path, encoding='utf-8', errors='replace').read()
              except Exception as e:
                  print(f'Warning: could not read {path}: {e}')
                  continue
              stripped = re.sub(r'--[^\n]*', '', content)
              for m in re.finditer(r';\s*\n[ \t]+(AND|OR|GROUP BY|ORDER BY|HAVING|LIMIT)', stripped):
                  line_no = stripped[:m.start()].count('\n') + 1
                  errors.append(f'{path}:{line_no}: stray ; before SQL continuation ({m.group(1).strip()})')

          if errors:
              print('ERROR: SQL template literal safety gate FAILED')
              print('Stray semicolons found inside pool.query() template literals.')
              print('These cause MySQL error 1064 at runtime (tsc/CI cannot detect them):')
              for e in errors:
                  print(f'  {e}')
              print()
              print('Fix: remove the trailing semicolon from the WHERE condition line.')
              print('See: TypeScript_Backend_Coding_Rules.md §SQL Template Literal Discipline')
              sys.exit(1)

          print(f'SQL template literal safety gate passed — {len(files)} .sql.ts file(s) scanned under {code_root!r}, 0 issues.')
          if not files:
              print()
              print(f'WARNING: zero files matched under {code_root!r}.')
              print('This gate is green because it found NOTHING TO CHECK, which is not')
              print('the same as passing. If this repo keeps its TypeScript somewhere')
              print('else, pass code_root: <dir> from the caller workflow.')
          PYEOF
