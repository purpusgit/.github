name: Reusable — Host Pin Integrity Gate (orphan-comment / SSH-URL / behind-HEAD)

# A GATE for the host app (main_org_orbit, default branch `cwb`), which pins each
# internal pkg_* package to a hardcoded commit SHA under `dependency_overrides`.
#
# Prevents two shipped failure classes:
#   (a) ORPHAN / STRIPPED KEY — a `pub upgrade` or bad merge removes the git:
#       override key but leaves the SHA-pin comment behind; the package silently
#       re-resolves to its branch tip and a broken cwb HEAD ships to every
#       flavour (confirmed 2026-07-18 for new_social).  -> HARD FAIL
#   (b) SSH URL — an internal git: override uses git@github.com: instead of
#       https://github.com/, which needs an insteadOf token rewrite to auth on
#       the runner. HTTPS is the safer floor.  -> HARD FAIL (configurable)
# Advisory: WARNS (never fails) when an override ref SHA is behind the package's
# live branch HEAD (needs a read token; skipped without one).
#
# Canonical checker: purpusgit/.github :: scripts/host_pin_integrity.py
# Mirrors reusable-taxo-lint.yml conventions in this repo.
#
# Thin caller (main_org_orbit/.github/workflows/host-pin-integrity.yml):
#   on: { pull_request: { paths: ['pubspec.yaml'] } }
#   jobs:
#     pin-integrity:
#       uses: purpusgit/.github/.github/workflows/reusable-host-pin-integrity.yml@main
#       secrets:
#         HOST_PIN_READ_TOKEN: ${{ secrets.HOST_PIN_READ_TOKEN }}
# ⛔ Do NOT add to required_status_checks with a paths: filter — a skipped
#    required check blocks the PR forever (see exact-pin-check.yml note).

on:
  workflow_call:
    inputs:
      pubspec_path:
        description: "Path to the host pubspec.yaml under the caller repo."
        default: "pubspec.yaml"
        type: string
      ssh_severity:
        description: >-
          How to treat internal SSH git URLs: 'error' (hard fail, default) or
          'warn'. Set 'warn' if the repo still relies on the CI insteadOf rewrite
          and has not migrated pubspec.yaml overrides to https:// URLs.
        default: "error"
        type: string
      head_branch:
        description: "Package branch to compare pin SHAs against (behind-HEAD warn)."
        default: "cwb"
        type: string
      gate_ref:
        description: "Ref of purpusgit/.github to fetch the checker script from."
        default: "main"
        type: string
    secrets:
      HOST_PIN_READ_TOKEN:
        description: >-
          Token with READ access to the internal pkg_* repos, used only for the
          advisory behind-HEAD comparison. Optional — the gate's (a) and (b)
          checks need no token. Falls back to the caller GITHUB_TOKEN for the
          public purpusgit/.github checkout.
        required: false

permissions:
  contents: read

jobs:
  pin-integrity:
    runs-on: ubuntu-latest
    name: host pin integrity (orphan / ssh / behind-HEAD)
    steps:
      - name: Checkout caller repo
        uses: actions/checkout@v4
        with:
          path: caller

      - name: Fetch host_pin_integrity.py from purpusgit/.github
        uses: actions/checkout@v4
        with:
          repository: purpusgit/.github
          ref: ${{ inputs.gate_ref }}
          path: gate
          token: ${{ secrets.HOST_PIN_READ_TOKEN || github.token }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Run host pin integrity gate
        env:
          GH_READ_TOKEN: ${{ secrets.HOST_PIN_READ_TOKEN }}
        run: |
          python gate/scripts/host_pin_integrity.py check \
            "caller/${{ inputs.pubspec_path }}" \
            --ssh-severity "${{ inputs.ssh_severity }}" \
            --head-branch "${{ inputs.head_branch }}"
