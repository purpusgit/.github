name: Reusable — Consolidated one-grep gates (A2)

# A2 is ROLLED OUT fleet-wide across the Flutter package repos. The earlier "scoped to
# japa and client_core ONLY / fleet-wide DEFERRED" restriction is LIFTED (founder-authorised)
# and must not be reinstated by anyone reading a stale copy of this header.
#
# Wiring a further repo still requires that repo's OWN numbers, and that requirement is not
# a formality: read the repo's live required contexts and its workflow files, set the run_*
# flags from those rather than copying another caller, and record the before/after billed
# job count. A caller copied wholesale enables a gate the repo never ran, or misses one it did.
#
# WHY ONE JOB. Actions bills per JOB, rounded UP to a whole minute. Four ~11-second
# grep jobs bill four whole minutes, not 44 seconds. Collapsing them into one job of
# four steps bills one minute. The saving is the rounding, not the runtime.
#
# WHY THE PREDICATES BELOW ARE COPIES, AND WHY THEY CANNOT DRIFT.
# A reusable WORKFLOW cannot be `uses:`d as a STEP, so a single job structurally
# cannot call reusable-colors-safety-gate.yml and friends. Converting those four into
# composite actions would rewrite the gate path that every repo in the org resolves
# `@main` — out of scope here, and exactly the fleet-wide change that stays deferred.
# So each gate step below carries a BYTE-IDENTICAL copy of the `run:` block from its
# single-purpose reusable in this same directory, and scripts/gate_selftest.py
# asserts that equality on every PR to this repo (a REQUIRED context on `main`).
# The two copies therefore go RED the moment they stop agreeing. The single-purpose
# file remains the source of record; this file mirrors it. Edit both, in one commit.
#
# The exact-pin / A1 / contrast predicates have no reusable in this repo to mirror —
# their source lives in the consumer repo — so no equality assertion is possible for
# them and gate_selftest says so rather than pretending otherwise.
#
# WHY EVERY GATE STEP IS `continue-on-error: true`.
# So that one red gate does not hide the other five. Each step still records its own
# result in `steps.<id>.outcome`; the final Verdict step aggregates them, writes a
# per-gate table to $GITHUB_STEP_SUMMARY, and exits 1 if any BLOCKING gate failed.
# Job-level red therefore preserves each gate's current blocking semantics exactly,
# and the Checks tab names the failing gate without anyone opening raw logs.
# Every gate consolidated here is blocking today; none is advisory. If one ever
# becomes advisory, drop its row out of the `fail=1` arm — per-step, never job-wide.

on:
  workflow_call:
    inputs:
      base_ref:
        description: 'Base branch the diff-based gates compare against'
        required: false
        type: string
        default: 'cwb'
      run_colours:
        description: 'Rule 24 — no hardcoded Colors.* / .withOpacity( / extension<X>()! additions'
        required: false
        type: boolean
        default: false
      run_dart:
        description: 'Dart escaped string interpolation check'
        required: false
        type: boolean
        default: false
      run_b9_text_decoration:
        description: >-
          Rule B9 — a TextStyle adopted from DefaultTextStyle.of(context) must
          neutralise `decoration` on the same statement. Text decoration INHERITS
          down a span tree, so a root span that adopts the ambient style paints
          the ambient's underline or strike through every child that sets only
          size, weight and colour. DEFAULTS FALSE, unlike run_secret_scan: this
          file's own header requires a repo's OWN numbers before a gate is wired,
          and a default-true would be exactly the wholesale copy it forbids.
          Fleet baseline measured 2026-09-05 (GitHub code search across
          org:purpusgit language:Dart, positive-controlled against "RichText" ->
          27 files and "Text.rich" -> 10 files, so the index is not blind):
          2 findings org-wide, BOTH in pkg_orbit_japa, both fixed in the change
          that introduced this gate. Every other Dart repo is at zero, so wiring
          one costs a caller line and nothing else.
        required: false
        type: boolean
        default: false
      run_barrel:
        description: 'Rule 66 — barrel & factory safety'
        required: false
        type: boolean
        default: false
      run_rule84:
        description: 'Rule 84 — config & flavor fork gate (3 checks)'
        required: false
        type: boolean
        default: false
      run_exact_pin:
        description: 'No exact sdk:/flutter: pins in pubspec.yaml'
        required: false
        type: boolean
        default: false
      run_a1:
        description: 'Rule A1 sizing-axis gate (needs tool/a1_sizing_axis_gate.py in the caller)'
        required: false
        type: boolean
        default: false
      run_contrast:
        description: 'WCAG AA contrast gate (needs tool/contrast_check.py in the caller)'
        required: false
        type: boolean
        default: false
      run_translation_keys:
        description: >
          Translation-key check. Folds in what translation-keys.yml runs as its own
          billed job (context `check / check`) by calling
          pkg_orbit_client_core/.github/workflows/translation-key-check.yml.
          The steps below are that workflow's consumer path copied verbatim, not a
          re-derivation. It mints a GitHub App installation token, so a caller that
          enables this MUST pass `secrets: inherit` — without it
          ORBIT_BOT_APP_ID / ORBIT_BOT_PRIVATE_KEY resolve empty and the
          "Verify a token was minted" step fails loudly rather than letting
          actions/checkout fall through to "Repository not found".
          Only the CONSUMER path is here. client_core's own self-check mode is a
          separate input (`run_translation_keys_self`) rather than a mode flag on
          this one, because the two share no steps at all: the consumer path mints
          a token and checks out another repo, the self path runs neither.
        required: false
        type: boolean
        default: false
      run_translation_keys_self:
        description: >
          Translation-key check, SELF mode — for pkg_orbit_client_core only, the repo
          that IS the translation source of truth. Runs the PR's own
          scripts/check_translations.py against the PR's own assets/translations, so a
          PR that edits the checker is judged by the edited checker and a PR that adds
          a key has that key read (the bug `self_check: true` was added to
          translation-key-check.yml to fix; the same reasoning, not a re-derivation).
          Needs no token and no second checkout — which is exactly why it folds in
          cleanly where the consumer path needed six steps. Enabling this on a repo
          with no scripts/check_translations.py is a hard error, by design.
        required: false
        type: boolean
        default: false
      run_base_url:
        description: >
          Base-URL discipline (3 checks) — pkg_orbit_client_core's variant of Rule 84,
          NOT a duplicate of `run_rule84`. Two of the three predicates genuinely differ
          and a caller must not substitute one for the other:
            * the host-literal grep EXCLUDES lib/flavor_config.dart and commented lines,
              because in client_core that file is where the hosts are SUPPOSED to live —
              run_rule84's copy excludes nothing, which is correct for a flavor repo and
              would red the source of truth for being the source of truth;
            * the `default:`-clause check has no run_rule84 equivalent at all.
          Only the String.fromEnvironment predicate is shared, and it is copied here
          byte-for-byte from base_url_discipline.yml, which is now a thin push-only
          caller of THIS workflow — so there is exactly one copy of all three, not two.
        required: false
        type: boolean
        default: false
      run_secret_scan:
        description: >-
          Diff-scoped secret scan. DEFAULTS TRUE, unlike every other input in this
          file, and deliberately so: org-level GitHub push protection / secret
          scanning was switched off org-wide for cost, and the replacement control
          has to apply everywhere by default rather than wait for 20-odd callers to
          opt in one at a time. Every existing caller picks it up with no caller-side
          edit. Set it false only to quarantine a repo that is mid-rotation, and say
          why in the caller.
        required: false
        type: boolean
        default: true

permissions:
  contents: read

jobs:
  # The check context this publishes is `<caller job id> / Consolidated gates (A2)`.
  # Read it off an observed check run before anyone puts it in branch protection —
  # never guess it from this YAML (see the note in pkg_orbit_client_core's
  # a1-sizing-axis-gate.yml, where all three of GitHub's naming shapes are written out
  # and all three were guessed wrong from the YAML on the same day).
  consolidated-gates:
    name: Consolidated gates (A2)
    runs-on: ubuntu-latest
    steps:
      # fetch-depth: 0 because the colours and barrel predicates both diff against a
      # base ref. It is a superset of what the other gates need.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # 3.11 exactly, because that is what a1-sizing-axis-gate.yml and
      # contrast-check-gate.yml pin today and both are REQUIRED checks. Note this also
      # becomes the `python3` the colours gate's comment-masker runs on, on any caller
      # that enables A1 or contrast; the masker is plain stdlib and unaffected.
      - name: Set up Python 3.11 (A1 + contrast detectors)
        if: ${{ inputs.run_a1 || inputs.run_contrast || inputs.run_translation_keys || inputs.run_translation_keys_self }}
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      # continue-on-error so a fetch failure does not abort the whole job and cost the
      # other gates their verdicts. The colours predicate has its own base-ref guard
      # and goes RED on an unresolvable ref, so the failure is still reported.
      - name: Fetch base branch
        if: ${{ inputs.run_colours }}
        continue-on-error: true
        run: git fetch origin ${{ inputs.base_ref || 'cwb' }}

      - name: Rule 24 — colours safety (no hardcoded Colors.* additions)
        id: colours
        if: ${{ inputs.run_colours }}
        continue-on-error: true
        run: |
          set +e
          FAILED=0
          BASE_REF="${{ inputs.base_ref || 'cwb' }}"

          # Never pass vacuously. If the base ref cannot be resolved the diff below
          # comes back EMPTY and the gate printed "No lib/ Dart files changed. Gate
          # passed." — a silent pass on an uncomputable diff. Same guard shape as
          # reusable-sql-typestring-safety-gate.yml.
          if ! git rev-parse --verify --quiet "origin/${BASE_REF}" >/dev/null; then
            echo "::error::Colours gate could not resolve base ref origin/${BASE_REF} — refusing to pass without diffing."
            exit 1
          fi

          # Mask `//` line comments before matching. The gate used to match its own
          # trigger strings inside prose: pkg_new_social PR #174 had to reword an
          # accurate comment ("...instead of a raw Colors.green/grey.") for no reason
          # other than to stop the regex firing — zero lines of code changed. A gate
          # that rewards making comments less accurate is worse than no gate.
          #
          # Only an UNQUOTED `//` opens a comment. A `//` inside a string literal (a
          # URL, say) is left alone, so real code after it on the same line is still
          # scanned. `/* */` is deliberately NOT handled: same-line block comments are
          # the sanctioned `/* intentional: <reason> */` stamp form and must keep
          # working exactly as they do now. A quote left open at end of line (a
          # multi-line string) masks nothing, which is the pre-existing behaviour.
          # `if 1:` lets the whole script sit indented inside this YAML block scalar;
          # unindented lines would terminate the block. \x27 / \x22 are a quote and a
          # double quote, spelled that way so the script survives shell single-quoting.
          mask_comments() {
            python3 -c 'if 1:
              import sys
              for raw in sys.stdin:
                  s = raw.rstrip("\n")
                  q = ""
                  i = 0
                  while i < len(s):
                      c = s[i]
                      if q:
                          if c == "\\":
                              i += 2
                              continue
                          if c == q:
                              q = ""
                      elif c == "\x27" or c == "\x22":
                          q = c
                      elif c == "/" and s[i:i + 2] == "//":
                          s = s[:i]
                          break
                      i += 1
                  sys.stdout.write(s + "\n")
              '
          }

          # lib/ Dart files changed in this PR (diff-only; excludes test/ to avoid false positives)
          CHANGED=$(git diff "origin/${BASE_REF}...HEAD" --name-only -- '*.dart' 2>/dev/null | grep '^lib/')

          if [ -z "$CHANGED" ]; then
            echo "No lib/ Dart files changed. Gate passed."
            exit 0
          fi

          while IFS= read -r FILE; do
            # Skip deleted files
            [ -f "$FILE" ] || continue

            # Skip colour/theme definition files — these legitimately use Colors.*
            # Pattern covers: theme/ directories, filenames with color/colour/palette, orbit_colors.dart
            if echo "$FILE" | grep -qiE '(theme/|/colors?[_.]/|orbit_colors\.|_theme\.dart$|colors?\.dart$|colours?\.dart$)' ||                echo "$(basename "$FILE")" | grep -qiE '^(colors?|colours?|palette|.*_theme)\.dart$'; then
              echo "Skipping colour/theme file: $FILE"
              continue
            fi

            # B5b — file-level `fixed-stage` opt-out, SCOPED TO THE COLOUR-SOURCING
            # CHECKS ONLY: hex literals and `Colors.*`.
            # Some surfaces are a deliberately fixed dark stage that does not follow
            # the theme (chant session, PiP, calibration wizard, wake overlay, voice
            # lock, welcome screen). Their hex literals have no light-token match BY
            # DESIGN, so B5 forced them to be suppressed one line at a time — one repo
            # reached 505 `// intentional:` stamps, 415 of which suppressed nothing.
            #
            # `Colors.*` is the same statement in another spelling and honours the same
            # header. It did not, and that asymmetry cost pkg_new_social PR #174 sixty-
            # nine per-line `// intentional:` stamps layered ON TOP of a header that had
            # already declared the file a fixed stage. B5b bans exactly that pairing:
            # `// intentional:` is the suppression token, so a line carrying one is
            # exempt forever — including a future edit that pastes a genuinely wrong
            # colour onto it. One header, one decision, one thing to review.
            #
            # It must NOT skip the whole file. The first draft of this used `continue`,
            # which ALSO disabled the `.withOpacity(` and `extension<X>()!` checks —
            # and `extension<X>()!` is a null-assertion CRASH check with nothing to do
            # with B5. One comment line would have opted a file out of a runtime-safety
            # gate. A fixed stage is a statement about colour SOURCING, not a licence
            # to crash.
            FIXED_STAGE=0
            if head -20 "$FILE" | grep -qE '^[[:space:]]*//[[:space:]]*fixed-stage:'; then
              FIXED_STAGE=1
              echo "fixed-stage (B5b): $FILE - hex + Colors.* skipped; withOpacity, extension<>()! still enforced"
            fi

            # Added lines only — lines starting with + but not the +++ file header
            ADDED=$(git diff "origin/${BASE_REF}...HEAD" -- "$FILE" 2>/dev/null | grep '^+' | grep -v '^+++')

            # The matching surface for every arm below: added lines, minus the ones
            # carrying an `intentional:` stamp, with `//` comments masked.
            # The `intentional:` filter runs FIRST and on the RAW line, exactly as each
            # arm ran it before — masking first would have stripped trailing
            # `// intentional: <reason>` stamps and turned them into new failures.
            ADDED_CODE=$(echo "$ADDED" | grep -v 'intentional:' | mask_comments)

            # Block any Colors.* except Colors.transparent
            # Uses perl negative lookbehind (?<![a-zA-Z]) to avoid false-positives like gradientColors.map
            # and negative lookahead (?!transparent) so Colors.transparent is permitted on the same line
            # Also exclude constructor default parameters (this.<param> = Colors.<X>)
            # BuildContext is unavailable at class-scope defaults — colorScheme tokens cannot be used there.
            # Skipped entirely on a `fixed-stage` file (see B5b above).
            COLOR_HITS=""
            if [ "$FIXED_STAGE" -eq 0 ]; then
              COLOR_HITS=$(echo "$ADDED_CODE" | grep -vP '\bthis\.[a-zA-Z_][a-zA-Z0-9_]* = Colors\.' | perl -ne 'print if /(?<![a-zA-Z])Colors\.(?!transparent\b)[a-zA-Z]/')
            fi

            if [ -n "$COLOR_HITS" ]; then
              echo ""
              echo "::error file=$FILE::Hardcoded Colors.* added — use semantic colour tokens instead."
              echo "  Fix options:"
              echo "    Success / verified / approved -> (Theme.of(context).extension<OrbitColors>())?.statusPositive ?? colorScheme.primary"
              echo "    Error / danger               -> colorScheme.error"
              echo "    Primary brand                -> colorScheme.primary"
              echo "    WhatsApp brand               -> (Theme.of(context).extension<OrbitColors>())?.brandWhatsapp ?? colorScheme.secondary"
              echo "    Whole surface ignores theme  -> declare '// fixed-stage: <why>' in the file header"
              echo "    Suppress (last resort)       -> add '// intentional: <reason>' on the same line"
              echo ""
              echo "$COLOR_HITS" | head -10
              FAILED=1
            fi

            # Block deprecated .withOpacity(); use .withValues(alpha:) — Flutter 3.27+
            OPACITY_HITS=$(echo "$ADDED_CODE" | grep '\.withOpacity(')

            if [ -n "$OPACITY_HITS" ]; then
              echo ""
              echo "::error file=$FILE::Deprecated .withOpacity() added — use .withValues(alpha: x) instead (Flutter 3.27+)."
              echo "$OPACITY_HITS" | head -5
              FAILED=1
            fi


            # Block non-null extension<X>()! assertions — crashes if host theme doesn't provide the extension
            # (Dark_Mode_Architecture.md §17)
            EXTENSION_BANG=$(echo "$ADDED_CODE" | grep 'extension<' | grep ')!')

            if [ -n "$EXTENSION_BANG" ]; then
              echo ""
              echo "::error file=$FILE::Non-null extension<X>()! added — use nullable pattern: extension<X>()?.field ?? colorScheme.fallback (Dark_Mode_Architecture.md §17)."
              echo "  Fix: final oc = Theme.of(context).extension<OrbitColors>();"
              echo "       final color = oc?.statusPositive ?? colorScheme.primary;"
              echo "$EXTENSION_BANG" | head -5
              FAILED=1
            fi


            # B5 — hex literals at call sites. WARNING ONLY for now.
            # B5 says call sites use tokens; hex is permitted only in the central
            # theme files (already skipped above). Nothing has ever enforced this,
            # which is how 583 call-site literals shipped in pkg_orbit_japa.
            # Deliberately non-failing on introduction: flipping it to an error
            # before every repo has its `fixed-stage` declarations in place would
            # red-wall unrelated PRs. Promote to FAILED=1 once those have landed.
            # {6,8} also matched 7 digits, which is not a valid Dart literal.
            # Color.fromARGB(...) is the same defect in another spelling and was missed
            # entirely - example/lib/main.dart already uses it.
            HEX_HITS=""
            if [ "$FIXED_STAGE" -eq 0 ]; then
              HEX_HITS=$(echo "$ADDED_CODE" | grep -oP 'Color\(0x(?:[0-9a-fA-F]{8}|[0-9a-fA-F]{6})\)|Color\.fromARGB\(' | head -10)
            fi
            if [ -n "$HEX_HITS" ]; then
              echo ""
              echo "::warning file=$FILE::B5 — hex colour literal added at a call site. Use a semantic token, or declare the file '// fixed-stage: <why>' if this surface deliberately ignores the theme."
              echo "$HEX_HITS"
            fi

          done <<< "$CHANGED"

          if [ $FAILED -eq 1 ]; then
            echo ""
            echo "Gate: Flutter Colours Safety (Rule 24)"
            echo "See: Dark_Mode_Architecture.md and Cross_Flavor_Shared_Widgets_Rules.md"
            exit 1
          fi

          echo "Flutter colours safety gate passed."

      - name: Dart escaped string interpolation check
        id: dart
        if: ${{ inputs.run_dart }}
        continue-on-error: true
        run: |
          HITS=$(grep -rn '\\${' lib/ --include="*.dart" 2>/dev/null || true)
          if [ -n "$HITS" ]; then
            echo "ERROR: Dart interpolation safety gate FAILED"
            echo "Escaped string interpolation found in Dart files."
            echo "\\${variable} produces literal text on screen, not the variable value:"
            echo ""
            echo "$HITS"
            echo ""
            echo "Fix: remove the backslash. Use ${var} not \\${var}."
            echo "See: Flutter_Coding_Rules.md §Dart String Interpolation Discipline"
            exit 1
          fi
          echo "Dart interpolation safety gate passed."

      # ── Rule B9 — an adopted ambient TextStyle must neutralise decoration ──
      # THE DEFECT THIS EXISTS FOR ARRIVED IN NO DIFF. pkg_orbit_japa shipped
      # yellow underlines under the Chant History day-card headline, in dark mode,
      # in production. The word "yellow" appears nowhere in that repo's lib/ —
      # nobody typed a colour. The headline is a RichText whose root span adopted
      # `DefaultTextStyle.of(context).style`, text decoration inherits down a span
      # tree, and the child spans set size, weight and colour but never reset
      # `decoration`. The ambient in question is Flutter's OWN MaterialApp fallback
      # style (material/app.dart, debugLabel "fallback style; consider putting your
      # text in a Material"), whose decorationColor is 0xFFFFFF00.
      #
      # WHY A GATE AND NOT A LINT. Rule 24 greps the DIFF, and there was no diff to
      # grep. The WCAG scan reads the declared OrbitColors tokens, and this colour
      # is not a token. `analyze` sees a valid TextStyle. The repo's History tests
      # read the .dart file AS A STRING and the source text was correct. No gate
      # failed and none could — see Flutter_UX_Rendering_Rules F22.
      #
      # SCOPE, HONESTLY: this is a keyhole, not a window. It catches the EXPLICIT
      # adoption form and nothing else. `Text.rich(TextSpan(children: [...]))`
      # inherits the ambient identically and contains none of the text below, and
      # a captured-context bug in general is invisible here. It is in this job
      # because it costs seconds of an already-billed minute, not because it closes
      # the class.
      - name: Rule B9 — an adopted ambient TextStyle must neutralise decoration
        id: b9_text_decoration
        if: ${{ inputs.run_b9_text_decoration }}
        continue-on-error: true
        run: |
          set -euo pipefail
          python3 <<'PYEOF'
          import os
          import re
          import sys

          # A Dart package always has a lib/. This gate is a TEXT scan of that
          # tree, so the one way it can lie is by scanning a tree that is not
          # there and publishing the empty result as clean. Both arms are
          # therefore explicit, and the "not applicable" arm says out loud that
          # it read nothing rather than printing a pass.
          files = []
          for d, _, names in os.walk("lib"):
              files += [os.path.join(d, n) for n in sorted(names)
                        if n.endswith(".dart")]

          if not files:
              if os.path.exists("pubspec.yaml"):
                  print("::error::Rule B9 gate found no .dart file under lib/ in a "
                        "repo that HAS a pubspec.yaml. That is a wrong scan root, "
                        "not a clean tree, and this gate refuses to publish green "
                        "having read nothing.")
                  sys.exit(1)
              print("No pubspec.yaml and no lib/*.dart: not a Dart package, so "
                    "Rule B9 does not apply here. Nothing was scanned, and that is "
                    "stated rather than reported as a pass.")
              sys.exit(0)

          ADOPT = re.compile(r"DefaultTextStyle\s*\.\s*of\s*\([^()]*\)\s*\.\s*style")

          # Its OWN token, deliberately not the colours gate's `intentional:` —
          # B5c: two gates sharing one suppression word blinds each of them to
          # the other's exceptions, permanently and silently.
          ALLOW = "b9-ok:"

          # The neutraliser must sit within the match line + 2. A statement spread
          # wider than that reds and gets reformatted. That is a cheap ceiling
          # chosen over parsing Dart, and it is the ceiling on purpose: the
          # upgrade path is a real parser and a two-site rule does not earn one.
          WINDOW = 3

          hits = []
          for path in files:
              with open(path, encoding="utf-8", errors="replace") as fh:
                  raw = fh.read().splitlines()
              # Rule B9 is QUOTED in the prose of the very files it governs, and a
              # comment saying "never do X" must not be scored as doing X.
              code = ["" if ln.lstrip().startswith("//") else ln for ln in raw]
              for i, ln in enumerate(code):
                  if not ADOPT.search(ln):
                      continue
                  if "decoration" in " ".join(code[i:i + WINDOW]):
                      continue
                  if ALLOW in " ".join(raw[max(0, i - 1):i + WINDOW]):
                      continue
                  hits.append((path, i + 1))

          print("Scanned " + str(len(files)) + " .dart file(s) under lib/.")

          if hits:
              for path, line in hits:
                  print("::error file=" + path + ",line=" + str(line) + "::Rule B9 "
                        "- this adopts the ambient TextStyle without neutralising "
                        "`decoration`. Text decoration INHERITS down a span tree, "
                        "so a child span that sets only fontSize, fontWeight and "
                        "color still draws whatever underline or strike the "
                        "ambient carried - and the ambient may be Flutter's own "
                        "MaterialApp fallback style, a yellow double underline "
                        "nobody typed. Fix: append `.copyWith(decoration: "
                        "TextDecoration.none)` on the same statement. Deliberate? "
                        "Put `b9-ok: <reason>` beside it.")
              print("")
              print(str(len(hits)) + " unneutralised ambient-TextStyle adoption(s).")
              sys.exit(1)

          print("Rule B9 passed: every adopted ambient TextStyle neutralises "
                "decoration.")
          PYEOF

      - name: Rule 66 — barrel & factory safety
        id: barrel
        if: ${{ inputs.run_barrel }}
        continue-on-error: true
        shell: bash
        run: |
          BASE="${{ github.base_ref }}"
          echo "Checking diff against origin/$BASE ..."

          # Pre-flight. Every check below is a diff against origin/$BASE, so if
          # that ref will not resolve there is no diff to compute and "no removals
          # found" would be a vacuous pass. A gate that cannot compute its diff
          # goes RED.
          if ! git rev-parse --verify --quiet "origin/$BASE" >/dev/null; then
            echo "⛔  Barrel gate could not resolve base ref origin/$BASE — refusing to pass without diffing."
            exit 1
          fi

          declare -a BARREL_FILES

          # What makes an index.dart protected is REACHABILITY, not exports.
          # Dart's convention: lib/src/ is private by definition, everything
          # else under lib/ is importable by any downstream package. This gate
          # is "Barrel & FACTORY safety" — 6 of the org's 7 nested index.dart
          # files are lib/endpoints/*/index.dart holding *EndpointsFactory
          # classes with ZERO export lines, and Rule 66 forbidden action #2 is
          # removing a method from exactly those. So `^export ` is the WRONG
          # discriminator here: it would drop all 6 factories, and the 7th
          # (binder's) has zero exports too — so it would match NONE of the
          # org's 7 nested index.dart files, i.e. protect nothing at all.
          # lib/src/ is the right one: it excludes
          # pkg_orbit_binder/lib/src/utils/index.dart (the Binder class — a
          # private implementation file no downstream can import, whose lines
          # this gate used to freeze, failing a REQUIRED check on legitimate
          # refactors) while keeping every public barrel and factory frozen.
          while IFS= read -r f; do
            [[ -n "$f" ]] && BARREL_FILES+=("$f")
          done < <(find lib/ -name "index.dart" -not -path "lib/src/*" 2>/dev/null | sort)

          while IFS= read -r f; do
            if grep -q "^export " "$f" 2>/dev/null; then
              BARREL_FILES+=("$f")
            fi
          done < <(find lib/ -maxdepth 1 -name "*.dart" 2>/dev/null | sort)

          if [ ${#BARREL_FILES[@]} -eq 0 ]; then
            echo "No barrel files found in lib/ — nothing to check."
            exit 0
          fi

          echo "Barrel files detected (${#BARREL_FILES[@]}):"
          printf '  %s\n' "${BARREL_FILES[@]}"
          echo ""

          FAILED=0

          for FILE in "${BARREL_FILES[@]}"; do
            # Three cases, not two.
            #   present at base   -> diff it
            #   absent at base    -> a NEW barrel file in this PR; legitimate, skip
            #   any other git err -> the diff is not computable; RED
            # `git cat-file -e` returns non-zero for the last two alike, and its
            # message text is not stable across git versions, so `git ls-tree` is
            # what separates them: exit 0 with EMPTY output means "the ref resolves
            # and the path simply is not in it"; non-zero means git itself failed.
            if ! git cat-file -e "origin/$BASE:$FILE" 2>/dev/null; then
              LS_OUT=$(git ls-tree --name-only "origin/$BASE" -- "$FILE" 2>&1)
              LS_RC=$?
              if [ "$LS_RC" -ne 0 ] || [ -n "$LS_OUT" ]; then
                echo "⛔  Barrel gate could not read origin/$BASE:$FILE (git exit $LS_RC) — refusing to pass without diffing."
                echo "$LS_OUT"
                exit 1
              fi
              echo "  ℹ️  $FILE — new in this PR (absent at origin/$BASE), skipping"
              continue
            fi

            REMOVED=$(git diff "origin/$BASE...HEAD" -- "$FILE" \
              | grep '^-' \
              | grep -v '^---' \
              | grep -v '^-[[:space:]]*//' \
              | grep -v '^-[[:space:]]*$' \
              || true)

            if [ -n "$REMOVED" ]; then
              echo ""
              echo "⛔  RULE 66 VIOLATION — removed lines in: $FILE"
              echo "──────────────────────────────────────────────────────"
              echo "$REMOVED"
              echo "──────────────────────────────────────────────────────"
              echo "  Downstream packages depend on every export here."
              echo "  Removing lines = silent breaking change for dependents."
              echo "  → Restore the removed lines, then re-push."
              echo ""
              FAILED=1
            else
              echo "  ✅ $FILE"
            fi
          done

          echo ""
          if [ "$FAILED" -eq 0 ]; then
            echo "✅  All barrel files OK — no exports removed."
          else
            echo "See CLAUDE.md Rule 66 for policy details."
            exit 1
          fi

      - name: Rule 84 — base URLs live only in client_core flavor_config.dart
        id: rule84_url
        if: ${{ inputs.run_rule84 }}
        continue-on-error: true
        run: |
          set -euo pipefail
          if grep -rnE "https?://[A-Za-z0-9.-]*(mypurpus\.com|bookmyorbit\.com)" lib/ --include=*.dart; then
            echo "::error::Hardcoded service host in a flavor. Base URLs live ONLY in pkg_orbit_client_core/lib/flavor_config.dart as a per-flavor exhaustive switch. See '0 Coding RULES/Base_URL_And_Service_Endpoint_Architecture.md'."
            exit 1
          fi
          echo "OK - no hardcoded service host."

      - name: Rule 84 — no base-URL fallback (a missing URL must be a compile error)
        id: rule84_fallback
        if: ${{ inputs.run_rule84 }}
        continue-on-error: true
        run: |
          set -euo pipefail
          if grep -rnE "String\.fromEnvironment\([^)]*defaultValue" lib/ --include=*.dart | grep -iE "url|host|endpoint|base"; then
            echo "::error::String.fromEnvironment(defaultValue:) used as a base-URL fallback. A missing base URL must be a compile error, never a silent sandbox default."
            exit 1
          fi
          echo "OK - no base-URL fallback."

      - name: Rule 84 — a flavor must not own another package's screens
        id: rule84_chat
        if: ${{ inputs.run_rule84 }}
        continue-on-error: true
        run: |
          set -euo pipefail
          M=$(find lib/screens/chat -type f -name '*.dart' 2>/dev/null | sort || true)
          if [ -n "$M" ]; then
            echo "::error::Rule 84 - this flavor holds chat screens owned by pkg_inapp_chat. Navigate by route instead."
            printf '  %s\n' $M
            exit 1
          fi
          echo "OK - no cross-package screens."

      # ── Base-URL discipline (client_core) ───────────────────────────────────
      # These three are the ONLY copy of base_url_discipline.yml's predicates. That
      # file still exists in pkg_orbit_client_core and still carries `push:
      # branches: [cwb]` — the trunk-push coverage this pull_request-only workflow
      # cannot replace — but its job is now a thin caller of THIS workflow with
      # run_base_url: true and everything else off. That is deliberate and is why
      # there is no second copy to drift: the three greps read the working tree and
      # need no base-ref diff, so unlike the colours and barrel predicates they are
      # perfectly safe on a push event where github.base_ref is empty.
      - name: Base URL — service hosts live ONLY in lib/flavor_config.dart
        id: base_url_host
        if: ${{ inputs.run_base_url }}
        continue-on-error: true
        run: |
          set -euo pipefail
          HITS=$(grep -rnE "https?://[A-Za-z0-9.-]*(mypurpus\.com|bookmyorbit\.com)" lib/ --include=*.dart \
                 | grep -v "^lib/flavor_config.dart:" \
                 | grep -vE ":[0-9]+:[[:space:]]*//" || true)
          if [ -n "$HITS" ]; then
            echo "::error::Service host literal outside lib/flavor_config.dart:"
            echo "$HITS"
            echo "Base URLs are declared once, per flavor, in flavor_config.dart. See '0 Coding RULES/Base_URL_And_Service_Endpoint_Architecture.md'."
            exit 1
          fi
          echo "OK - no host literal outside flavor_config.dart."

      - name: Base URL — no 'default:' clause in flavor_config.dart
        id: base_url_default
        if: ${{ inputs.run_base_url }}
        continue-on-error: true
        run: |
          set -euo pipefail
          if grep -nE "^[[:space:]]*default:" lib/flavor_config.dart; then
            echo "::error::A 'default:' clause defeats switch exhaustiveness. Adding a new AppFlavor MUST be a compile error, not a silent fallback to whatever the default returns (usually sandbox). That is exactly how a production build ends up pointed at the sandbox database."
            exit 1
          fi
          echo "OK - every base-URL switch stays exhaustive."

      - name: Base URL — no fallback via String.fromEnvironment
        id: base_url_fallback
        if: ${{ inputs.run_base_url }}
        continue-on-error: true
        run: |
          set -euo pipefail
          if grep -rnE "String\.fromEnvironment\([^)]*defaultValue" lib/ --include=*.dart | grep -iE "url|host|endpoint|base"; then
            echo "::error::String.fromEnvironment(defaultValue:) used as a base-URL fallback. A missing base URL must be a compile error, never a silent default."
            exit 1
          fi
          echo "OK - no base-URL fallback."

      - name: Exact-pin check — no exact sdk/flutter pins in pubspec.yaml
        id: exact_pin
        if: ${{ inputs.run_exact_pin }}
        continue-on-error: true
        run: |
          set -euo pipefail
          fail=0
          # ---- HARD FAIL: exact sdk:/flutter: in environment ----
          # matches `sdk: '3.5.3'`, `flutter: "3.24.3"`, `sdk: 3.5.3` — but NOT `>=`, `^`, `<`, or `sdk: flutter`
          if grep -nE "^[[:space:]]*(sdk|flutter):[[:space:]]*['\"]?[0-9]+\.[0-9]+\.[0-9]+['\"]?[[:space:]]*(#.*)?$" pubspec.yaml; then
            echo "::error file=pubspec.yaml::Exact SDK/Flutter pin found. Use a range (>=X <Y or ^X), never an exact version — Flutter_Upgrade_Readiness A1. Exact pins collapse the constraint intersection and block every consumer on a toolchain bump."
            fail=1
          fi
          # ---- WARN: exact dependency version pin (no ^, >=, <, git:, path:, sdk:) ----
          # heuristic: `  name: 1.2.3` two-space-indented dep line with a bare semver value
          awk '
            /^dependencies:/{d=1} /^dev_dependencies:/{d=1} /^(flutter|environment|dependency_overrides):/{d=0}
            d && /^  [a-z0-9_]+:[ \t]*["'\'']?[0-9]+\.[0-9]+\.[0-9]+["'\'']?[ \t]*$/ {
              printf("::warning file=pubspec.yaml,line=%d::Exact dependency pin: %s — prefer ^X unless an incompatibility forces it (A1 warn tier).\n", NR, $0)
            }' pubspec.yaml || true
          exit $fail

      - name: Rule A1 — sizing-axis detector self-test
        id: a1_selftest
        if: ${{ inputs.run_a1 }}
        continue-on-error: true
        run: python3 tool/a1_sizing_axis_gate.py --selftest

      - name: Rule A1 — sizing-axis scan
        id: a1_scan
        if: ${{ inputs.run_a1 }}
        continue-on-error: true
        run: python3 tool/a1_sizing_axis_gate.py lib

      - name: Contrast — checker self-test
        id: contrast_selftest
        if: ${{ inputs.run_contrast }}
        continue-on-error: true
        run: python3 tool/contrast_check.py --selftest

      - name: Contrast — WCAG AA scan of OrbitColors
        id: contrast_scan
        if: ${{ inputs.run_contrast }}
        continue-on-error: true
        run: python3 tool/contrast_check.py

      # ── Translation keys ────────────────────────────────────────────────────
      # Verbatim consumer path of
      # pkg_orbit_client_core/.github/workflows/translation-key-check.yml.
      # A reusable workflow cannot be `uses:`d as a STEP, so folding it in means
      # copying its steps; every one below is byte-for-byte that workflow's, with
      # only `continue-on-error: true` and an `id:` added so a failure reaches the
      # Verdict table instead of aborting the job and costing the other gates their
      # verdicts. The predicate itself — check_translations.py, run against
      # client_core's assets/translations at `cwb` — is unchanged.
      - name: Mint a short-lived installation token (translation source)
        id: tk_token
        if: ${{ inputs.run_translation_keys }}
        continue-on-error: true
        uses: actions/create-github-app-token@v2
        with:
          app-id: ${{ secrets.ORBIT_BOT_APP_ID }}
          private-key: ${{ secrets.ORBIT_BOT_PRIVATE_KEY }}
          owner: purpusgit
          # Least privilege: this token only ever needs to read one repo.
          repositories: pkg_orbit_client_core
          # @v2 is load-bearing: @v1 DECLARES every `permission-*` input and then
          # silently ignores it — no error, no warning. Do not downgrade the pin.
          permission-contents: read

      - name: Verify a token was minted
        id: tk_verify
        if: ${{ inputs.run_translation_keys }}
        continue-on-error: true
        run: |
          set -euo pipefail
          if [ -z "${{ steps.tk_token.outputs.token }}" ]; then
            echo "::error::No installation token was minted. Check the org secrets ORBIT_BOT_APP_ID / ORBIT_BOT_PRIVATE_KEY, that orbit-sessions-bot is installed on this repo, and that the CALLER passed secrets: inherit. Checking out pkg_orbit_client_core cannot proceed without it — failing loudly instead of letting actions/checkout fall through to an unauthenticated 'Repository not found'."
            exit 1
          fi

      - name: Checkout pkg_orbit_client_core (translation source of truth)
        id: tk_checkout
        if: ${{ inputs.run_translation_keys }}
        continue-on-error: true
        uses: actions/checkout@v4
        with:
          repository: purpusgit/pkg_orbit_client_core
          token: ${{ steps.tk_token.outputs.token }}
          ref: cwb
          # Its own subdirectory: the job root is already this repo's checkout
          # (fetch-depth 0, needed by the colours and barrel predicates) and must
          # not be clobbered.
          path: .translation-source
          sparse-checkout: |
            assets/translations
            scripts/check_translations.py

      - name: Check translation keys
        id: tk_check
        if: ${{ inputs.run_translation_keys }}
        continue-on-error: true
        # base/head come from the PR event, exactly as translation-keys.yml passed
        # them in as inputs. A reusable workflow sees the CALLER's event context, so
        # github.event.pull_request.* resolves here identically — no new input needed.
        run: |
          python3 .translation-source/scripts/check_translations.py \
            "${{ github.event.pull_request.base.sha }}" "${{ github.event.pull_request.head.sha }}" \
            --translations-dir .translation-source/assets/translations

      # ── Translation keys, SELF mode (client_core only) ──────────────────────
      # No token and no second checkout: the repo under test IS the source of truth,
      # so the checker and the locale files are already at the job root from the
      # fetch-depth-0 checkout above. This is the whole reason the self path folds in
      # where the consumer path needed six steps.
      #
      # The `--demo` self-test runs FIRST and reports as its own row, so a broken
      # CHECKER stays legible as a separate red from a real missing-key violation —
      # the same separation the A1 and contrast detectors get.
      - name: Translation checker self-test (--demo)
        id: tk_self_demo
        if: ${{ inputs.run_translation_keys_self }}
        continue-on-error: true
        run: python3 scripts/check_translations.py --demo

      - name: Check translation keys (self)
        id: tk_self_check
        if: ${{ inputs.run_translation_keys_self }}
        continue-on-error: true
        run: |
          python3 scripts/check_translations.py \
            "${{ github.event.pull_request.base.sha }}" "${{ github.event.pull_request.head.sha }}" \
            --translations-dir assets/translations

      # ── Diff-scoped secret scan ───────────────────────────────────────
      # Stands in for the org-level push-protection / secret-scanning product, which
      # was switched off org-wide for cost. It is NOT equivalent to it and must not be
      # described as such: push protection rejects at PUSH time and scans all history;
      # this runs at PR REVIEW time over this PR's own diff only. The step says so in
      # its own output on every run, pass or fail, so nobody reads a green here as
      # "this repo has no committed secrets".
      #
      # A STEP, not a job. Actions bills per job rounded up to a whole minute, so a
      # separate secret-scan job would cost a billed minute per PR event on every repo
      # in the fleet; folded in here it costs seconds of an already-billed minute.
      #
      # DIFF-SCOPED, not history-scoped, and that is load-bearing rather than lazy.
      # Repos in this org already carry known committed credentials predating the
      # current rotation work. A full-tree scan would red every PR on those findings
      # forever, and an always-red gate is un-requireable and gets switched off inside
      # a week - which is how you end up with no control at all. Pre-existing findings
      # are the founder-paced rotation queue's job, not this step's.
      #
      # The base-sha diff shape is service_mongo_admin's js-syntax-gate.yml secrets
      # step, reused rather than re-derived: `github.event.pull_request.base.sha` via
      # env, three-dot against HEAD. Three-dot matches the colours and barrel
      # predicates above; on a pull_request checkout HEAD is the merge commit, so
      # base.sha is already the merge base and two-dot happens to agree - three-dot
      # keeps agreeing if that ever stops being true.
      #
      # FAILS CLOSED. Every path where the diff cannot be computed - empty base sha,
      # unresolvable ref, git itself erroring - exits non-zero with a message saying
      # it is a SCANNER failure and not a clean tree. "The scanner broke so nothing
      # was found" must never publish as green; that is the vacuous-pass shape the
      # colours and barrel guards above exist to kill, and it does not get to come
      # back in through this step.
      - name: Secret scan - no new secret-shaped string added by this PR
        id: secret_scan
        if: ${{ inputs.run_secret_scan }}
        continue-on-error: true
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          set -euo pipefail

          # UNCONDITIONAL and FIRST, so it is in the log on the pass path, the
          # violation path and the scanner-broke path alike.
          echo "This check runs at PR review time, not push time. Anything already on a branch is already in git history and still needs rotating through the founder-paced rotation queue - this step only stops NEW secrets from being added going forward."
          echo ""

          python3 <<'PYEOF'
          import os
          import re
          import subprocess
          import sys

          # A list, not one unreadable regex: adding a vendor shape is a new row, and
          # the label is what the reviewer reads in the annotation. This is a
          # lightweight shape guard, NOT an entropy scanner - it will not catch a
          # bare high-entropy blob assigned to a variable named `x`, and it is not
          # meant to. Do not grow it into one; reach for a real scanner if that is
          # ever the requirement.
          PATTERNS = [
              ("private key header",
               r"-----BEGIN (?:RSA |EC |DSA |OPENSSH |PGP )?PRIVATE KEY-----"),
              ("AWS access key id",
               r"\bAKIA[0-9A-Z]{16}\b"),
              ("Stripe secret key",
               r"\bsk_(?:live|test)_[A-Za-z0-9]{16,}"),
              ("GitHub token",
               r"\b(?:ghp|gho|ghu|ghs|ghr)_[A-Za-z0-9]{20,}"),
              ("GitHub fine-grained PAT",
               r"\bgithub_pat_[A-Za-z0-9_]{20,}"),
              ("Slack token",
               r"\bxox[baprs]-[A-Za-z0-9-]{10,}"),
              ("JWT",
               r"\beyJ[A-Za-z0-9_-]{10,}\.[A-Za-z0-9_-]{10,}\.[A-Za-z0-9_-]{10,}"),
              ("hardcoded credential assignment",
               r"(?i)(?:api[_-]?key|secret|token|password)\s*[:=]\s*"
               r"[\"'][A-Za-z0-9+/_-]{20,}[\"']"),
          ]

          # Same-line escape hatch, same idea as the colours gate's `intentional:`
          # stamp. Without one, the first false positive on the generic assignment
          # pattern means an emergency PR to this org-wide file while somebody is
          # trying to ship - which is exactly when a gate gets disabled instead.
          ALLOW = "notasecret"

          def git(*args):
              """Run git or die. A non-zero git here means the diff is NOT computable,
              which is a scanner failure and must never be reported as a clean tree."""
              p = subprocess.run(("git",) + args, capture_output=True, text=True)
              if p.returncode != 0:
                  print("::error::Secret scan could not run 'git " + " ".join(args) +
                        "' (exit " + str(p.returncode) + "). The diff is not computable, "
                        "so this gate refuses to pass. This is a SCANNER failure, not a "
                        "clean tree - do not merge on the strength of it.")
                  sys.stderr.write(p.stderr)
                  sys.exit(1)
              return p.stdout

          base = os.environ.get("BASE_SHA", "").strip()
          if not base:
              print("::error::Secret scan could not resolve the PR base sha "
                    "(github.event.pull_request.base.sha is empty - this workflow is "
                    "pull_request-only by design). The diff is not computable, so this "
                    "gate refuses to pass. This is a SCANNER failure, not a clean tree.")
              sys.exit(1)

          # Resolve before diffing, so an unresolvable base reds here with a base-ref
          # message rather than further down with a confusing one.
          git("rev-parse", "--verify", "--quiet", base + "^{commit}")

          # Added/modified/copied/renamed only; -U0 so the only '+' lines are real
          # additions and no unchanged context line can trip a pattern.
          diff = git("diff", "--diff-filter=ACMR", "-U0", base + "...HEAD")

          hits = []
          path = "(unknown)"
          for line in diff.splitlines():
              if line.startswith("+++ "):
                  path = line[4:]
                  if path.startswith("b/"):
                      path = path[2:]
                  continue
              if not line.startswith("+") or line.startswith("+++"):
                  continue
              text = line[1:]
              if ALLOW in text:
                  continue
              for label, rx in PATTERNS:
                  if re.search(rx, text):
                      hits.append((path, label))
                      break

          print("Diff scoped to " + base[:12] + "...HEAD, added lines only.")

          if hits:
              # The matched text is NEVER echoed. Printing it would copy the
              # credential into a log that is readable by anyone who can read the
              # run, which is a second disclosure on top of the commit.
              for path, label in hits:
                  print("::error file=" + path + "::Secret scan - a line added by this "
                        "PR matches the shape of a " + label + ". Remove it and rotate "
                        "the credential; secrets belong in GitHub Actions secrets or "
                        "the deploy env file, never in the tree. False positive? Put "
                        "'notasecret' on the same line with a reason.")
              print("")
              print(str(len(hits)) + " secret-shaped line(s) added by this PR.")
              sys.exit(1)

          print("Secret scan passed: this PR adds no secret-shaped line.")
          PYEOF

      # One row per gate step above: label ~ outcome ~ the one-line reason a FAIL means.
      # `outcome` (not `conclusion`) is what continue-on-error preserves.
      - name: Verdict — per-gate summary
        if: always()
        env:
          ROWS: |
            Rule 24 colours safety~${{ steps.colours.outcome }}~a hardcoded Colors.*, a deprecated .withOpacity(, or a non-null extension<X>()! was added on a changed lib/ line
            Dart escaped interpolation~${{ steps.dart.outcome }}~escaped string interpolation in lib/**.dart renders as literal text on screen
            Rule B9 ambient TextStyle decoration~${{ steps.b9_text_decoration.outcome }}~a TextStyle adopted from DefaultTextStyle.of(context) is handed to a span tree without neutralising `decoration`, so an ambient underline or strike paints through every child span that only set size, weight and colour - OR the gate found no lib/**.dart in a repo that has a pubspec.yaml, which is a wrong scan root and not a clean tree
            Rule 66 barrel and factory safety~${{ steps.barrel.outcome }}~a line was removed from a public barrel or factory index.dart, which is a silent breaking change for dependents
            Rule 84 hardcoded service host~${{ steps.rule84_url.outcome }}~a mypurpus.com or bookmyorbit.com host is hardcoded in lib/ instead of client_core flavor_config.dart
            Rule 84 base-URL fallback~${{ steps.rule84_fallback.outcome }}~String.fromEnvironment(defaultValue:) is used as a base-URL fallback; a missing base URL must be a compile error
            Rule 84 cross-package screens~${{ steps.rule84_chat.outcome }}~this flavor holds chat screens owned by pkg_inapp_chat; navigate by route instead
            Base URL hardcoded service host~${{ steps.base_url_host.outcome }}~a mypurpus.com or bookmyorbit.com host literal was found in lib/ outside lib/flavor_config.dart
            Base URL switch exhaustiveness~${{ steps.base_url_default.outcome }}~a 'default:' clause in lib/flavor_config.dart defeats switch exhaustiveness, so a new AppFlavor silently falls back instead of failing to compile
            Base URL fallback~${{ steps.base_url_fallback.outcome }}~String.fromEnvironment(defaultValue:) is used as a base-URL fallback; a missing base URL must be a compile error
            Exact-pin check~${{ steps.exact_pin.outcome }}~an exact sdk: or flutter: pin was found in pubspec.yaml environment:; use a range
            Rule A1 detector self-test~${{ steps.a1_selftest.outcome }}~the A1 detector failed its own fixtures, so the detector is broken and not the code under review
            Rule A1 sizing-axis scan~${{ steps.a1_scan.outcome }}~a sizing or layout value branches on platform instead of on window width
            Contrast checker self-test~${{ steps.contrast_selftest.outcome }}~the contrast checker failed its own fixtures, so the checker is broken and not the tokens under review
            Contrast WCAG AA scan~${{ steps.contrast_scan.outcome }}~an OrbitColors token does not meet WCAG 2.1 AA against the surface it renders on
            Translation source token~${{ steps.tk_token.outcome }}~the GitHub App installation token for reading pkg_orbit_client_core could not be minted; check that the caller passes secrets: inherit
            Translation source token present~${{ steps.tk_verify.outcome }}~no installation token was minted, so the translation source could not be checked out
            Translation source checkout~${{ steps.tk_checkout.outcome }}~pkg_orbit_client_core assets/translations could not be checked out, so translation keys were never compared
            Translation keys~${{ steps.tk_check.outcome }}~a translation key added or changed in this PR is missing from one or more locales in pkg_orbit_client_core assets/translations
            Translation checker self-test~${{ steps.tk_self_demo.outcome }}~this repo's own scripts/check_translations.py failed its --demo assertions, so the checker is broken and not the locale files under review
            Secret scan (diff-scoped)~${{ steps.secret_scan.outcome }}~a line added by this PR matches a credential shape (private-key header, AKIA, sk_live/sk_test, ghp_/github_pat_, xox*, JWT, or a quoted api_key/secret/token/password assignment) - OR the scanner could not compute the PR diff and refused to pass on an uncomputable diff
            Translation keys (self)~${{ steps.tk_self_check.outcome }}~a translation key added or changed in this PR is missing from one or more locales in this repo's OWN assets/translations
        run: |
          # errexit is ON before line 1 (/usr/bin/bash -e {0}) and `set -uo pipefail`
          # does NOT clear it — only `set +e` does. Without this line the first
          # non-zero below would kill the step and publish NO summary at all, which
          # is the exact bug this step exists to prevent.
          set +e
          fail=0
          {
            echo "## Consolidated gates (A2)"
            echo ""
            echo "| Gate | Verdict | Why |"
            echo "| --- | --- | --- |"
          } >> "$GITHUB_STEP_SUMMARY"
          while IFS='~' read -r gate outcome reason; do
            [ -z "$gate" ] && continue
            case "$outcome" in
              success)
                printf '| %s | PASS | |\n' "$gate" >> "$GITHUB_STEP_SUMMARY"
                ;;
              skipped|"")
                printf '| %s | not enabled for this repo | |\n' "$gate" >> "$GITHUB_STEP_SUMMARY"
                ;;
              *)
                fail=1
                printf '| %s | **FAIL** | %s |\n' "$gate" "$reason" >> "$GITHUB_STEP_SUMMARY"
                echo "::error title=$gate::$reason"
                ;;
            esac
          done <<< "$ROWS"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          if [ "$fail" -ne 0 ]; then
            echo "Every gate above is blocking today, so any FAIL row fails this job." >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi
          echo "All enabled gates passed." >> "$GITHUB_STEP_SUMMARY"
