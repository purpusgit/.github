name: TypeScript Type Check — reusable

# Lifted from service_mongo_social (node 22 version).
# service_nearyest has repo-specific scripts (check-escaped-interpolation.mjs,
# check-json-columns.mjs, integration tests) that cannot be in a shared gate;
# those remain in-repo and call this workflow for the base type check.
#
# Why paths filter: a paths filter on the CALLER prevents vacuous runs on
# markdown-only PRs. The caller owns the trigger and paths decision; this
# reusable just runs tsc when invoked.
#
# ⛔ A paths filter belongs on the caller's `on:` ONLY where this context is
# NOT a required check on that repo. Where it IS required, a filtered trigger
# creates no check run at all and blocks the PR on an absence (CI-G1). Note
# also that skipping the CALLER JOB with `if:` does not help: a skipped
# `uses:` job never creates the nested `<caller> / <callee>` context, so the
# required context still never reports.

on:
  workflow_call:
    inputs:
      runner: { type: string, default: ubuntu-latest }

permissions:
  contents: read

jobs:
  tsc:
    name: tsc --noEmit
    # ── Cancel superseded runs ──────────────────────────────────────────────
    # A push that supersedes an in-flight run leaves that run billing to
    # completion for a verdict nobody reads. Actions bills per JOB, rounded UP
    # to a whole minute, so the waste is whole minutes per superseded push.
    #
    # ⛔ `github.repository` IS LOAD-BEARING. This reusable is called by nine
    # service repos and `github.workflow` resolves to the CALLER's workflow
    # name, which is the same string in several of them. Without the repository
    # in the key, a push in one repo would cancel an in-flight run in another —
    # a cross-repo outage that presents as a random cancelled gate.
    #
    # ⛔ Cancellation is gated to `pull_request` deliberately. A run on the
    # trunk is the record that the merged state is green; cancelling it would
    # delete that evidence to save a minute.
    concurrency:
      group: ${{ github.repository }}-${{ github.workflow }}-tsc-${{ github.event.pull_request.number || github.ref }}
      cancel-in-progress: ${{ github.event_name == 'pull_request' }}
    runs-on: ${{ inputs.runner }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
      - run: npm ci
      - name: Detect TypeScript sources
        id: tscan
        run: |
          if find . -type f \( -name '*.ts' -o -name '*.tsx' \) \
               -not -path './node_modules/*' -print -quit | grep -q . ; then
            echo "has_ts=true"  >> "$GITHUB_OUTPUT"
          else
            echo "has_ts=false" >> "$GITHUB_OUTPUT"
            echo "::notice::No TypeScript files found in repo — skipping tsc"
          fi
      - name: TypeScript type-check
        if: steps.tscan.outputs.has_ts == 'true'
        run: npx --yes --package=typescript@5 tsc --noEmit
