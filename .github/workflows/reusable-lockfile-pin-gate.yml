name: Reusable — Lockfile & Internal Pin Gate

# Why this gate exists, and what it deliberately does NOT check.
#
# Several repos in this org run `npm install` in CI rather than `npm ci`. The
# difference matters: `npm ci` REFUSES a lockfile that disagrees with
# package.json, while `npm install` silently reconciles it and reports success.
# So for those repos a lockfile-only pull request — a pin bump, exactly the kind
# this org makes constantly for its internal `github:purpusgit/...` packages —
# is verified by nothing at all. A green run proves the resolver could reach
# agreement, not that the committed lockfile is the one that was reviewed.
#
# ⛔ THIS GATE DOES NOT CHECK `integrity`, ON PURPOSE. npm prints
# `npm warn skipping integrity check for git dependency` on every install of a
# git-hosted package: the field is recorded and never verified. A gate that
# asserted on it for exactly the dependencies this org pins by SHA would be a
# control that looks present and binds nothing — the failure class these gates
# exist to remove. The commit SHA in `resolved` is the real pin, so that is what
# is checked.
#
# Three checks, all pure file inspection — no network, no install, no toolchain:
#   1. Every internal git dependency is pinned to a full 40-hex commit SHA.
#      Catches an EMPTY pin (`...client#`, which resolves to the default branch
#      and floats), a branch pin, and a tag pin. The empty-pin case is not
#      hypothetical: it merged into this org once, and CI stayed green because
#      the lockfile happened to have resolved correctly beforehand.
#   2. The lockfile's recorded ref for each such dependency equals the
#      package.json pin. Catches a lockfile that was never regenerated after the
#      pin moved — which `npm install`-based CI will not catch either.
#   3. The repo has exactly one lockfile and it matches its package manager.
#      Catches an npm lockfile committed to a pnpm repo, which is not cosmetic:
#      `pnpm install --frozen-lockfile` then fails, and a Dockerfile running
#      `npm ci` in such a repo builds against a tree nothing else uses.

on:
  workflow_call:
    inputs:
      org:
        description: >-
          Org prefix whose git dependencies must be SHA-pinned. Dependencies
          outside it (public registry packages, other orgs) are not this gate's
          business and are ignored.
        type: string
        default: purpusgit
      check_ancestry:
        description: >-
          Also verify that each pinned SHA still exists upstream and is an ancestor of a
          protected branch. DEFAULT FALSE, and deliberately: the three checks above are
          pure file inspection, and this one makes network calls. Anything that can fail
          because GitHub is having a bad day should be opt-in and separately switchable.
        type: boolean
        default: false
      protected_branch:
        description: Branch the pinned SHA must be an ancestor of, when check_ancestry is on.
        type: string
        default: sandbox

jobs:
  lockfile-pin-gate:
    runs-on: ubuntu-latest
    name: Lockfile and internal pin check
    steps:
      - uses: actions/checkout@v5.1.0
      - name: Check internal pins and lockfile agreement
        run: |
          python3 - "${{ inputs.org }}" <<'PY'
          import json, os, re, sys

          org = sys.argv[1]
          problems = []

          if not os.path.exists("package.json"):
              print(f"No package.json — nothing for this gate to check.")
              raise SystemExit(0)

          pkg = json.load(open("package.json"))

          npm_lock  = os.path.exists("package-lock.json")
          pnpm_lock = os.path.exists("pnpm-lock.yaml")
          yarn_lock = os.path.exists("yarn.lock")

          # ── 3. one lockfile, matching the package manager ──────────────────
          locks = [n for n, p in (("package-lock.json", npm_lock),
                                  ("pnpm-lock.yaml", pnpm_lock),
                                  ("yarn.lock", yarn_lock)) if p]
          if not locks:
              problems.append(
                  "No lockfile committed. An install here resolves whatever is "
                  "newest at build time, so two builds of the same commit are not "
                  "the same build.")
          elif len(locks) > 1:
              problems.append(
                  f"More than one lockfile committed: {', '.join(locks)}. Exactly "
                  "one package manager owns a repo; a second lockfile is read by "
                  "some tool somewhere and silently disagrees with the first.")

          declared_pm = (pkg.get("packageManager") or "").split("@")[0]
          if declared_pm and locks:
              expected = {"npm": "package-lock.json", "pnpm": "pnpm-lock.yaml",
                          "yarn": "yarn.lock"}.get(declared_pm)
              if expected and locks[0] != expected:
                  problems.append(
                      f'package.json declares packageManager "{declared_pm}" but the '
                      f"committed lockfile is {locks[0]}, not {expected}.")

          # ── 1. internal git deps are pinned to a full commit SHA ───────────
          # `github:owner/repo#ref` and `git+https://…#ref` both appear in this org.
          deps = {}
          for section in ("dependencies", "devDependencies", "optionalDependencies"):
              deps.update(pkg.get(section) or {})

          def owner_of(spec):
              """Owner in `github:owner/repo#ref`, `git+https://github.com/owner/repo.git#ref`
              or `git+ssh://git@github.com/owner/repo.git#ref`. Returns None when the spec
              is not a git dependency at all."""
              if spec.startswith("github:"):
                  rest = spec[len("github:"):]
              elif spec.startswith(("git+", "git:", "https://github.com/")):
                  m = re.search(r"github\.com[:/](?P<rest>[^#]+)", spec)
                  if not m:
                      return None
                  rest = m.group("rest")
              else:
                  return None
              parts = rest.split("#")[0].split("/")
              # Lowercased on both sides: GitHub owners are case-insensitive, so
              # `github:PurpusGit/...` installs identically and must not slip past. An
              # owner match that misses is indistinguishable from a repo with no internal
              # dependencies -- it prints "0 internal git dependencies checked" and exits
              # 0. That is how the first draft of this gate passed its own fail fixture.
              return parts[0].lower() if parts and parts[0] else None

          internal = {}
          for name, spec in deps.items():
              if isinstance(spec, str) and owner_of(spec) == org.lower():
                  internal[name] = spec

          sha_re = re.compile(r"#([0-9a-f]{40})$")
          for name, spec in sorted(internal.items()):
              m = sha_re.search(spec)
              if m:
                  continue
              if "#" not in spec:
                  problems.append(
                      f'"{name}": "{spec}" has NO ref at all — it resolves to the '
                      "default branch and moves under you.")
              elif spec.endswith("#"):
                  problems.append(
                      f'"{name}": "{spec}" has an EMPTY pin. This is not a pin: it '
                      "resolves to the default branch, and a lockfile that already "
                      "held a good ref will keep CI green while the manifest floats.")
              else:
                  problems.append(
                      f'"{name}": "{spec}" is not pinned to a 40-character commit '
                      "SHA. A branch or tag can be moved after review.")

          # ── 2. the lockfile agrees with the manifest, per dependency ───────
          def lock_refs_npm(path):
              data = json.load(open(path))
              found = {}
              for key, node in (data.get("packages") or {}).items():
                  nm = node.get("name") or key.split("node_modules/")[-1]
                  res = node.get("resolved") or ""
                  m = re.search(r"#([0-9a-f]{40})\b", res)
                  if m:
                      found.setdefault(nm, set()).add(m.group(1))
              for name, node in (data.get("dependencies") or {}).items():
                  m = re.search(r"#([0-9a-f]{40})\b", node.get("version") or "")
                  if m:
                      found.setdefault(name, set()).add(m.group(1))
              return found

          def lock_refs_pnpm(path):
              text = open(path, encoding="utf-8").read()
              found = {}
              # pnpm records the resolved tarball URL, whose last path segment is the
              # commit, keyed by `'<name>@https://codeload…/<sha>'`.
              #
              # ⛔ NO WILDCARD FALLBACK. The first draft collected every codeload SHA in
              # the file under a `"*"` key and fell back to it when a dependency's own
              # name was not found. That made check 2 unreachable on pnpm for any repo
              # with a second git dependency: a dep pinned in the manifest but ABSENT
              # from the lockfile passed, because some other dep's SHA matched. The
              # fallback existed to avoid a false red and produced a false green, which
              # is the worse of the two by the whole margin of why this gate exists.
              for name, sha in re.findall(
                      r"'([^']+)@https://codeload\.github\.com/[^']+/([0-9a-f]{40})'",
                      text):
                  found.setdefault(name, set()).add(sha)
              return found

          lock_refs, lock_read = {}, True
          if npm_lock:
              lock_refs = lock_refs_npm("package-lock.json")
          elif pnpm_lock:
              lock_refs = lock_refs_pnpm("pnpm-lock.yaml")
          elif internal:
              # A lockfile this gate cannot parse (yarn today) must not be scored as
              # agreement. Skipping check 2 silently while still printing "checked" is
              # the control-that-binds-nothing shape, so it is reported instead.
              lock_read = False
              problems.append(
                  f"{locks[0] if locks else 'the lockfile'} is not a format this gate can "
                  "read, so the manifest pins above were NOT checked against it. Add a "
                  "parser here rather than letting this pass quietly.")

          if lock_read:
              for name, spec in sorted(internal.items()):
                  m = sha_re.search(spec)
                  if not m:
                      continue          # already reported by check 1
                  want = m.group(1)
                  got = lock_refs.get(name)
                  if got is None:
                      problems.append(
                          f'"{name}" is pinned to {want[:10]} in package.json but the '
                          "lockfile records no commit for it. The lockfile was not "
                          "regenerated after the pin changed.")
                  elif want not in got:
                      problems.append(
                          f'"{name}" is pinned to {want[:10]} in package.json but the '
                          f"lockfile resolves {', '.join(sorted(s[:10] for s in got))}. "
                          "The installed code is not the reviewed code.")

          if problems:
              print("ERROR: lockfile and internal pin gate FAILED")
              print("")
              for p in problems:
                  print(f"  - {p}")
              print("")
              print("Fix: correct the pin in package.json, then regenerate the lockfile")
              print("with your package manager's lock-only mode (npm install")
              print("--package-lock-only / pnpm install --lockfile-only) and commit both.")
              raise SystemExit(1)

          n = len(internal)
          print(f"Lockfile and internal pin gate passed "
                f"({n} internal git dependenc{'y' if n == 1 else 'ies'} checked).")

          # Hand the SHA-pinned dependencies to the optional ancestry step. Only written
          # when this step succeeds -- an earlier `raise SystemExit(1)` returns before it,
          # and step 2 is skipped on a failed step anyway. Step 2 still handles the file
          # being absent, because "no file" and "no pins" must not look like an error.
          with open("/tmp/internal-pins.txt", "w", encoding="utf-8") as fh:
              for name, spec in sorted(internal.items()):
                  m = sha_re.search(spec)
                  if not m:
                      continue
                  # `.git` must come off: `git+https://github.com/purpusgit/x.git#<sha>` is a
                  # form owner_of() explicitly supports, and `purpusgit/x.git` is a 404 --
                  # which step 2 would report as "cannot reach", turning a PARSER BUG into a
                  # credentials message on a run that prints "passed". A control that looks
                  # present and binds nothing, which is the shape this gate exists to remove.
                  repo_name = spec.split("#")[0].rstrip("/").split("/")[-1]
                  if repo_name.endswith(".git"):
                      repo_name = repo_name[:-4]
                  fh.write(f"{name}\t{owner_of(spec)}/{repo_name}\t{m.group(1)}\n")
          PY

      - name: Check each pinned SHA is still on a protected branch
        if: ${{ inputs.check_ancestry }}
        env:
          GH_TOKEN: ${{ github.token }}
          PROTECTED: ${{ inputs.protected_branch }}
        run: |
          python3 - <<'PY'
          import json, os, urllib.request, urllib.error

          token = os.environ["GH_TOKEN"]
          protected = os.environ["PROTECTED"]

          def api(path):
              req = urllib.request.Request("https://api.github.com" + path)
              req.add_header("Authorization", f"Bearer {token}")
              req.add_header("Accept", "application/vnd.github+json")
              try:
                  return 200, json.load(urllib.request.urlopen(req))
              except urllib.error.HTTPError as e:
                  return e.code, None

          try:
              lines = [l.rstrip("\n") for l in open("/tmp/internal-pins.txt") if l.strip()]
          except FileNotFoundError:
              lines = []

          if not lines:
              print("No SHA-pinned internal dependencies — nothing to check.")
              raise SystemExit(0)

          # ⛔ THREE OUTCOMES, NOT TWO. `compare` answers 404 both when the commit is gone
          # and when the token cannot see the repository. A gate that scores 404 as a
          # violation reports a credential problem as a tampered pin — a false red on the
          # most alarming possible message, which is how a gate stops being believed.
          # So reachability is established FIRST, and an unreachable repo is INDETERMINATE:
          # reported, and not a failure. Same shape as the auth package's
          # verified / refused / indeterminate split, for the same reason.
          problems, unknown, verified = [], [], 0
          reachable, has_base = {}, {}

          for line in lines:
              name, repo, sha = line.split("\t")

              if repo not in reachable:
                  code, _ = api(f"/repos/{repo}")
                  reachable[repo] = (code == 200)
              if not reachable[repo]:
                  # Reported PER DEPENDENCY, not per repo. Caching the probe is right;
                  # caching the diagnostic silently drops every dependency after the first
                  # on the same unreachable repo, and the summary then undercounts what was
                  # skipped — an indeterminate that is not reported is just a miss.
                  unknown.append(
                      f'"{name}": cannot reach {repo}. The pin was NOT checked — this is a '
                      "permissions or availability problem, not a finding about the pin.")
                  continue

              code, data = api(f"/repos/{repo}/compare/{protected}...{sha}")

              if code == 404:
                  # ⛔ 404 IS STILL AMBIGUOUS HERE, one level down from the repo probe. It
                  # means "no such commit" OR "no such base ref in this repo" — the bodies
                  # are byte-identical. `protected_branch` is one string for every
                  # dependency while this org's convention is three-way (sandbox for
                  # backend, cwb for Flutter, main for .github), so the first cross-family
                  # pin hits a missing base ref, not a missing commit. Scoring that as a
                  # violation prints "a force-push orphaned your commit" at someone whose
                  # commit is fine — the exact false red this step was designed against.
                  if repo not in has_base:
                      bcode, _ = api(f"/repos/{repo}/branches/{protected}")
                      has_base[repo] = (bcode == 200)
                  if not has_base[repo]:
                      unknown.append(
                          f'"{name}": {repo} has no branch "{protected}", so the pin was NOT '
                          "checked. Set `protected_branch` to the branch this dependency's "
                          "repository actually uses.")
                      continue
                  problems.append(
                      f'"{name}": {sha[:10]} does not exist in {repo}. A force-push or a '
                      "deleted branch can orphan a commit that a lockfile still names.")
                  continue

              if code != 200:
                  unknown.append(f'"{name}": comparing {sha[:10]} in {repo} answered HTTP {code}.')
                  continue

              status = (data or {}).get("status")
              if status in ("identical", "behind"):
                  verified += 1
                  continue
              problems.append(
                  f'"{name}": {sha[:10]} is not an ancestor of {repo}@{protected} '
                  f"(compare says \"{status}\"). If you pinned a PULL REQUEST head, that is "
                  "expected — a squash merge creates a new commit and orphans the branch "
                  "commit. Re-pin to the SHA that landed on the branch.")

          for u in unknown:
              print(f"  ? {u}")

          if problems:
              print("ERROR: pinned SHA ancestry check FAILED")
              print("")
              for p in problems:
                  print(f"  - {p}")
              raise SystemExit(1)

          # Not the word "passed" when nothing was verified. A run that checked nothing
          # and a run that found nothing wrong print the same line otherwise, and the
          # first one is the failure this whole gate is about.
          print(f"Ancestry check: {verified} pin(s) verified against @{protected}, "
                f"{len(unknown)} indeterminate.")
          PY
