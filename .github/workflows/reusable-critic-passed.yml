name: reusable-critic-passed

# Rule 78 (external critic pass before merge) as a REQUIRED STATUS CHECK.
#
# Why this exists
# ---------------
# Rule 78 has been enforced two ways, and neither is a gate:
#   1. Socially — a session remembering to run a critic pass.
#   2. By accident — branch protection refusing a merge when one identity both
#      raised and pushed the PR, which depends on which account a session
#      managed to authenticate as, not on whether anyone reviewed the diff.
#
# Green CI has never meant reviewed. A client PR passed three checks carrying a
# wrong-price defect (a null offer id coerced to an empty string, so the plain
# base plan fell through to whatever offer sat at index 0). CI could not see it;
# an external critic pass did.
#
# Once this is a required context it does not matter who raised the PR, and the
# push-approval setting can be retired.
#
# ⛔ THE JOB KEY BELOW IS THE REQUIRED STATUS CHECK NAME.
# Branch protection requires the bare context `critic-passed`. Renaming the job
# turns the gate into an ABSENCE — which blocks rather than passes, but reports
# NOTHING to explain why, and presents as a PR that simply never becomes
# mergeable. Do not rename it.
#
# ⛔ STALENESS IS ANCHORED TO PUSH TIME, NOT COMMIT TIME.
# `commit.committer.date` is settable and does not change on push, so a commit
# authored before a critique but pushed after it would slip through. The gate
# uses the earliest workflow-run `run_started_at` for the head SHA — a
# server-side stamp — and falls back to committer date only if that read fails.
# This needs `actions: read`; without it the gate warns and degrades.
#
# ⚠ KNOWN CEILING of the push-time anchor: it takes the EARLIEST run for the
# head SHA, so force-pushing back to a previously-run SHA yields an anchor that
# predates the label. And from 2026-10-01 runs are purged at the Actions
# retention setting (default 90d), so on a long-lived PR the earliest surviving
# run can be the labeled-triggered one, reddening a legitimately critiqued PR.
# Both are logged against this gate; neither is fixed here.
#
# ⛔ CALLERS MUST TRIGGER ON `labeled` AND `unlabeled`.
# Without them the check never re-runs when the label changes, and a red run
# stays red after the critique lands. See the caller snippet at the bottom.

on:
  workflow_call:
    inputs:
      label:
        description: "Label that marks a completed external critic pass."
        required: false
        type: string
        default: critic-passed

jobs:
  critic-passed:
    runs-on: ubuntu-latest
    permissions:
      pull-requests: read
      contents: read
      actions: read        # listWorkflowRunsForRepo — the push-time anchor, see step 1
    steps:
      - name: Assert an external critic pass covers THIS head commit
        uses: actions/github-script@v7
        with:
          script: |
            const LABEL = `${{ inputs.label }}`;
            const pr = context.payload.pull_request;
            if (!pr) {
              core.setFailed('Not a pull_request event — this gate only evaluates pull requests.');
              return;
            }

            // ---- 1. Establish the anchor: when did THIS head commit become
            // reviewable? Everything below compares the label against it.
            const { data: headCommit } = await github.rest.repos.getCommit({
              owner: context.repo.owner,
              repo: context.repo.repo,
              ref: pr.head.sha,
            });
            const committerTime = new Date(headCommit.commit.committer.date);

            // ⛔ DO NOT anchor on commit.committer.date alone.
            // It is COMMIT METADATA: written when the commit is created, unchanged
            // by pushing, and settable via GIT_COMMITTER_DATE. The natural failure
            // needs no bad intent — make three commits locally at T0, push only the
            // first, get it critiqued and labelled at T0+10, then push the other
            // two. Both carry committer dates OLDER than the label, so a
            // committer-date comparison reports GREEN on code no critic ever saw.
            // That is precisely the hole this gate exists to close.
            //
            // The server-side anchor is when CI FIRST SAW this SHA. GitHub stamps
            // run_started_at at push time; it cannot be backdated by a client.
            let firstSeen = null;
            try {
              const runs = await github.paginate(
                github.rest.actions.listWorkflowRunsForRepo,
                {
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  head_sha: pr.head.sha,
                  per_page: 100,
                }
              );
              const times = runs
                .map((r) => new Date(r.run_started_at || r.created_at))
                .filter((d) => !Number.isNaN(d.getTime()))
                .map(Number);
              if (times.length) firstSeen = new Date(Math.min(...times));
            } catch (e) {
              // Fail SAFE, not open: without the push-time anchor we still have the
              // committer date, which is conservative in the common case. Warn loudly
              // so a permissions regression is visible rather than silent.
              core.warning(
                `Could not read workflow runs for the head SHA (${e.message}). ` +
                `Falling back to committer date alone — the backdating hole is OPEN ` +
                `for this run. Check the job's \`actions: read\` permission.`
              );
            }

            // Take the LATER of the two. Push time defeats a backdated committer
            // date; committer date covers a head with no runs yet.
            const headTime =
              firstSeen && firstSeen > committerTime ? firstSeen : committerTime;
            core.info(
              `head ${pr.head.sha.slice(0, 8)} — committed ${committerTime.toISOString()}` +
              (firstSeen ? `, first seen by CI ${firstSeen.toISOString()}` : ', no CI runs yet') +
              ` -> anchor ${headTime.toISOString()}`
            );

            // ---- 2. Is the label on the PR right now?
            // Read from the event payload, which is the state at trigger time.
            const labelPresent = (pr.labels || []).some((l) => l.name === LABEL);
            if (!labelPresent) {
              core.setFailed(
                `No \`${LABEL}\` label on this pull request.\n\n` +
                `Rule 78: a session that did NOT author this diff must review it, then apply the ` +
                `\`${LABEL}\` label. Green CI is not review — CI checks that the code builds, not ` +
                `that it is correct.`
              );
              return;
            }

            // ---- 3. WHEN was it applied? A label older than the head commit
            // means the critic reviewed an earlier commit and later pushes are
            // uncovered. This is the same defect class as GitHub's own
            // "require approval of the most recent reviewable push", and it is
            // the whole reason this gate is not just "does the label exist".
            const events = await github.paginate(
              github.rest.issues.listEventsForTimeline,
              {
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: pr.number,
                per_page: 100,
              }
            );

            const applied = events
              .filter((e) => e.event === 'labeled' && e.label && e.label.name === LABEL)
              .map((e) => ({
                at: new Date(e.created_at),
                by: (e.actor && e.actor.login) || 'unknown',
              }))
              .sort((a, b) => a.at - b.at);

            const last = applied[applied.length - 1];
            if (!last) {
              core.setFailed(
                `The \`${LABEL}\` label is present but no labeling event was found in the timeline, ` +
                `so it is impossible to prove WHEN the critique happened. Remove the label and ` +
                `re-apply it after reviewing the current head.`
              );
              return;
            }

            if (last.at < headTime) {
              core.setFailed(
                `STALE CRITIQUE.\n\n` +
                `  \`${LABEL}\` applied : ${last.at.toISOString()} (by ${last.by})\n` +
                `  head became reviewable : ${headTime.toISOString()}` +
                (firstSeen && firstSeen > committerTime ? ' (push time)' : ' (commit time)') + `\n\n` +
                `The critic reviewed an EARLIER commit; everything pushed since is unreviewed. ` +
                `Re-review the current head, then remove and re-apply the label.`
              );
              return;
            }

            // ---- 4. WHO applied it? Until now this value was captured and never
            // compared, so a pull request's own author could label their own diff and
            // this gate reported `reviewed by <author>`. Rule 78 needs someone who did
            // not write it.
            //
            // ⚠ THIS CLOSES THE TRIVIAL CASE ONLY, and the limit is worth stating where
            // someone reading the gate will see it. Under the bot-raise / dedicated-
            // reviewer procedure the author is always the bot and any other credential
            // passes this check — including one held by the same session. A comparison
            // of logins cannot see that two identities are one actor. Enforcement of
            // that needs a critic credential no executing session holds; this check is
            // the floor, not the ceiling.
            if (last.by === pr.user.login) {
              core.setFailed(
                `SELF-LABELLED.\n\n` +
                `  \`${LABEL}\` applied by : ${last.by}\n` +
                `  pull request author  : ${pr.user.login}\n\n` +
                `Rule 78 needs a critic who did not write the diff. Remove the label and ` +
                `have someone else review the current head.`
              );
              return;
            }

            // ---- 5. Is there anything to READ? A label is a click and leaves no record
            // of what was examined. The critic must also post a verdict comment, and it
            // must postdate the same anchor the label does — otherwise a comment written
            // before the last push counts for code nobody saw.
            //
            // ⛔ The marker is what separates a critique from the approval that the
            // bot-raise procedure posts on EVERY pull request at raise time. Without it
            // this check would be satisfied by that approval and assert nothing.
            const MARKER = 'CRITIC VERDICT:';
            const [issueComments, reviews] = await Promise.all([
              github.paginate(github.rest.issues.listComments, {
                owner: context.repo.owner, repo: context.repo.repo,
                issue_number: pr.number, per_page: 100,
              }),
              github.paginate(github.rest.pulls.listReviews, {
                owner: context.repo.owner, repo: context.repo.repo,
                pull_number: pr.number, per_page: 100,
              }),
            ]);
            const verdicts = [
              ...issueComments.map((c) => ({ at: new Date(c.created_at), by: c.user && c.user.login, body: c.body || '' })),
              ...reviews.map((r) => ({ at: new Date(r.submitted_at), by: r.user && r.user.login, body: r.body || '' })),
            ].filter((c) => c.body.includes(MARKER) && c.by === last.by && c.at >= headTime);

            if (!verdicts.length) {
              core.setFailed(
                `NO VERDICT.\n\n` +
                `  \`${LABEL}\` applied by : ${last.by}\n` +
                `  head became reviewable : ${headTime.toISOString()}\n\n` +
                `The label says a critique happened; nothing on this pull request records ` +
                `WHAT was examined. Post a comment or review from ${last.by} containing ` +
                `"${MARKER}" and what you checked, then re-apply the label.`
              );
              return;
            }

            core.info(`OK — \`${LABEL}\` applied ${last.at.toISOString()} by ${last.by}; covers head.`);
            core.notice(`critic-passed: ${pr.head.sha.slice(0, 8)} labelled by ${last.by}, verdict recorded`);

# ---------------------------------------------------------------------------
# Thin caller — copy into each consumer repo as
# `.github/workflows/critic-passed.yml`. Nothing here is repo-specific.
#
#   name: critic-passed
#   on:
#     pull_request:
#       types: [opened, synchronize, reopened, labeled, unlabeled]
#   jobs:
#     critic-passed:
#       uses: purpusgit/.github/.github/workflows/reusable-critic-passed.yml@<SHA>
#
# Pin the SHA, never `@main` — the same discipline the auth-coverage callers use.
#
# ROLLOUT ORDER, and it matters:
#   1. Merge this workflow.
#   2. Add the caller to ONE repo and prove all four cases:
#        no label            -> red
#        label applied       -> green
#        label, then a push  -> RED AGAIN   (the property above)
#        label removed       -> red
#   3. Only then add `critic-passed` to branch protection, and only then roll
#      the caller out more widely.
#
# ⛔ NEVER add the required context to a repo that has no caller yet. A required
# context with no workflow to satisfy it blocks every PR in that repo forever,
# and presents as a PR that never becomes mergeable with no red X to explain it.
# ---------------------------------------------------------------------------
