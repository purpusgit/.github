name: Flutter Analyze — reusable (pkg_* packages)

# Runs EXACTLY the predicate the pkg_* repos already ran before conversion:
#
#     flutter analyze lib/ --no-fatal-infos
#
# Verified byte-identical against the pre-conversion flutter_analyze.yml in
# pkg_orbit_nearyest, pkg_orbit_marketplace, pkg_orbit_japa and
# pkg_orbit_discover_orgs. `--no-fatal-infos` is deliberate policy: infos are
# not fatal, warnings are. A conversion PR must change WHERE a predicate lives,
# never WHAT it asserts.
#
# Use this for any Flutter package repo (pkg_*). NOT for main_org_orbit
# (host app uses GIT_PASSWORD + flutter pub get, not dart pub get).
#
# Differences from main_org_orbit:
#   - Secret: GH_PAT (not GIT_PASSWORD)
#   - Resolver: dart pub get --no-example (package; not flutter pub get)
#   - Push to cwb triggers here too (cwb is the integration branch)
#
# ── Two steps removed 2026-08-02, and why ────────────────────────────────────
#
# This file used to describe itself as a "superset of pkg_orbit_auth +
# pkg_orbit_binder flutter_analyze.yml". That was accurate, and that was the
# defect: a superset of two repos is new, undeclared enforcement for the other
# eighteen.
#
#   1. A mandatory `flutter test` step that hard-failed when test/ was absent.
#      Only pkg_orbit_auth and pkg_orbit_binder ran anything like it before
#      conversion. It caused 7 of the batch's 14 reds, none of them analyze
#      findings — a repo went red under a check named "analyze" for having no
#      test suite. Even in pkg_orbit_binder, the repo the gate was modelled on,
#      it took three commits of test repair to pass.
#      This is NOT a judgement that the rule is wrong. It may well be right. It
#      belongs in its own reusable workflow, declared, piloted and rolled out on
#      its own merit — the same treatment we require of any other new gate. See
#      "Open items" in docs/rules-to-gates-rollout.md.
#
#   2. An escaped-string-interpolation grep guard. Duplicate:
#      reusable-dart-safety-gate.yml already owns that rule and is wired to 17
#      repos. Two gates flagging one line is duplicate noise with two
#      suppression tokens (see standing invariant 1).
#      Its second pattern was additionally DEAD:
#        grep -rnP '\\$(?=[A-Za-z_])'
#      PCRE reads the `$` as an end-of-line anchor, so "backslash at end of line
#      immediately followed by a letter" can never match. Verified against a
#      line containing a literal backslash-dollar-x: no match. The working form
#      is '\\\$(?=[A-Za-z_])'. Deleting it therefore loses no coverage that
#      existed — but the no-brace `\$var` case it was aiming at IS a real gap
#      and is filed against the dart gate, which is where that rule lives.

on:
  workflow_call:
    secrets:
      GH_PAT:
        required: true

permissions:
  contents: read

jobs:
  analyze:
    # Job id `analyze` and job name `flutter analyze` are load-bearing: GitHub
    # reports this to consumers as the context `analyze / flutter analyze`.
    # Renaming either breaks every repo's branch-protection required check.
    name: flutter analyze
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Configure git for private org repos
        run: |
          git config --global url."https://x-access-token:${{ secrets.GH_PAT }}@github.com/".insteadOf "git@github.com:"
          git config --global --add url."https://x-access-token:${{ secrets.GH_PAT }}@github.com/".insteadOf "https://github.com/"
      - uses: subosito/flutter-action@v2
        with:
          flutter-version-file: .fvmrc
          channel: stable
          # Caches the Flutter SDK only. The pub cache is a separate store and is
          # handled by the step below.
          cache: true

      # ── Pub cache ────────────────────────────────────────────────────────────
      # Why this exists: every pkg_* repo resolves ~13 PRIVATE purpusgit git
      # dependencies (`ref: cwb`). Without a cache each run re-clones all of them
      # from scratch, in 21 repos, on every PR. The SDK cache above does not cover
      # this — `~/.pub-cache` is a different store.
      #
      # Why it is safe with branch-tracking deps: pub re-resolves every `ref: cwb`
      # dependency on each run. The cache holds the git OBJECT STORE, so a hit makes
      # the fetch incremental, not stale — a moved cwb HEAD is still picked up. This
      # is a speed change, never a resolution change.
      #
      # Why only this gate: Actions bills each job rounded up to a whole minute, so
      # shaving seconds off a sub-minute job saves NOTHING. This gate averages 2.09
      # job-minutes per run (4,486 billable min / 2,146 runs, 30-day audit) — the
      # one Flutter workflow whose runs straddle the minute boundary. Do not copy
      # this step onto the grep gates expecting a saving.
      - name: Cache pub packages
        uses: actions/cache@v4
        with:
          path: ~/.pub-cache
          # pubspec.yaml is the dependency declaration every pkg_* repo commits.
          # pubspec.lock is included where present but is NOT relied on — most
          # package repos do not commit one, and hashFiles tolerates a miss.
          key: pub-${{ runner.os }}-${{ hashFiles('**/pubspec.yaml', '**/pubspec.lock') }}
          # Fall back to any previous pub cache for this OS. A partial hit still
          # saves the bulk of the clone; pub reconciles the difference.
          restore-keys: |
            pub-${{ runner.os }}-

      - run: dart pub get --no-example
      # Behaviourally tested by scripts/gate_selftest.py, which pins this step
      # BY NAME. Renaming it reds the harness rather than silently dropping the
      # only fixture-backed assertion this gate has.
      - name: Analyze (lib only)
        run: flutter analyze lib/ --no-fatal-infos --no-pub
