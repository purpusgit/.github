name: Flutter Analyze — reusable (pkg_* packages)

# Runs EXACTLY the predicate the pkg_* repos already ran before conversion:
#
#     flutter analyze lib/ --no-fatal-infos
#
# Verified byte-identical against the pre-conversion flutter_analyze.yml in
# pkg_orbit_nearyest, pkg_orbit_marketplace, pkg_orbit_japa and
# pkg_orbit_discover_orgs. `--no-fatal-infos` is deliberate policy: infos are
# not fatal, warnings are. A conversion PR must change WHERE a predicate lives,
# never WHAT it asserts.
#
# Use this for any Flutter package repo (pkg_*). NOT for main_org_orbit
# (host app uses GIT_PASSWORD + flutter pub get, not dart pub get).
#
# Differences from main_org_orbit:
#   - Credential: a minted App installation token (migrated 2026-08-24 off
#     GH_PAT), not GIT_PASSWORD
#   - Resolver: dart pub get --no-example (package; not flutter pub get)
#   - Push to cwb triggers here too (cwb is the integration branch)
#
# ── Two steps removed 2026-08-02, and why ────────────────────────────────────
#
# This file used to describe itself as a "superset of pkg_orbit_auth +
# pkg_orbit_binder flutter_analyze.yml". That was accurate, and that was the
# defect: a superset of two repos is new, undeclared enforcement for the other
# eighteen.
#
#   1. A mandatory `flutter test` step that hard-failed when test/ was absent.
#      Only pkg_orbit_auth and pkg_orbit_binder ran anything like it before
#      conversion. It caused 7 of the batch's 14 reds, none of them analyze
#      findings — a repo went red under a check named "analyze" for having no
#      test suite. Even in pkg_orbit_binder, the repo the gate was modelled on,
#      it took three commits of test repair to pass.
#      This is NOT a judgement that the rule is wrong. It may well be right. It
#      belongs in its own reusable workflow, declared, piloted and rolled out on
#      its own merit — the same treatment we require of any other new gate. See
#      "Open items" in docs/rules-to-gates-rollout.md.
#
#   2. An escaped-string-interpolation grep guard. Duplicate:
#      reusable-dart-safety-gate.yml already owns that rule and is wired to 17
#      repos. Two gates flagging one line is duplicate noise with two
#      suppression tokens (see standing invariant 1).
#      Its second pattern was additionally DEAD:
#        grep -rnP '\\$(?=[A-Za-z_])'
#      PCRE reads the `$` as an end-of-line anchor, so "backslash at end of line
#      immediately followed by a letter" can never match. Verified against a
#      line containing a literal backslash-dollar-x: no match. The working form
#      is '\\\$(?=[A-Za-z_])'. Deleting it therefore loses no coverage that
#      existed — but the no-brace `\$var` case it was aiming at IS a real gap
#      and is filed against the dart gate, which is where that rule lives.

on:
  workflow_call:
    inputs:
      run_web_build:
        description: >
          Build example/ for web with dart2js in THIS job, as a step, instead of as a
          separate billed job in the caller's own flutter-web-build.yml (Rule 88:
          `flutter analyze` is structurally blind to what dart2js catches — unbalanced
          brackets from conflict resolution, CardTheme -> CardThemeData breakage).

          WHY HERE AND NOT IN reusable-consolidated-gates.yml. The consolidated job is
          a static-grep job: checkout plus, conditionally, Python 3.11. It has no
          Flutter toolchain at all. `flutter build web` is not a grep — it needs the
          SDK, the private-sibling git credential and a resolved pub cache, and this
          job has already paid for all three (subosito/flutter-action with .fvmrc and
          cache: true, the App-token mint, the insteadOf config, `dart pub get`).
          Putting the build in the consolidated job would install a second Flutter SDK
          per PR event, which is the opposite of what A2 consolidation is for. Here the
          marginal cost is the build itself and nothing else.

          ⚠️ ENABLING THIS WIDENS `analyze / flutter analyze`. That context is required
          on every consumer's trunk, so a dart2js failure now blocks merges. Both repos
          enabling it on day one were verified green on cwb HEAD first (japa run over
          b6b633f, client_core over 2fc2735, both `success`) so this reds nothing on
          arrival. Default false: no other caller changes behaviour.

          Requires example/ to exist in the caller. There is no fallback, deliberately —
          a silently-skipped build is a gate that has gone quiet.
        required: false
        type: boolean
        default: false
    secrets:
      ORBIT_BOT_APP_ID:
        # Declared so ${{ secrets.ORBIT_BOT_APP_ID }} resolves inside the
        # mint step below -- actionlint flags an undeclared workflow_call
        # secret as a static error even though the org secret genuinely
        # exists, because a reusable workflow's `secrets.*` namespace is
        # scoped to exactly what it declares here, independent of what the
        # org actually has. required: false for the same reason GH_PAT is
        # required: false two entries down: a caller still on the explicit
        # `secrets: { GH_PAT: ... }` map (pre-migration) must still be able
        # to START this job -- required: true on a name that map doesn't
        # pass would itself produce the startup_failure / zero-check-runs
        # failure this migration exists to retire, just moved one input
        # earlier. The empty-token guard in "Configure git for private org
        # repos" below is what turns a missing value into a loud, named
        # ::error instead of a silent gap.
        required: false
      ORBIT_BOT_PRIVATE_KEY:
        # Same reasoning as ORBIT_BOT_APP_ID immediately above.
        required: false
      GH_PAT:
        # VESTIGIAL, READ BY NOTHING, AND DELIBERATELY STILL DECLARED.
        #
        # The credential migration below stopped reading GH_PAT, and the first
        # draft of that change deleted this block. Deleting it is a fleet
        # outage, not a tidy-up: GitHub validates a caller's `secrets:` map
        # against the callee's declaration, and a caller passing an UNDECLARED
        # secret does not fail the job -- the run never starts at all
        # (`startup_failure`), so NO check run named `analyze / flutter analyze`
        # is ever created. A required check that never reports blocks every PR
        # on that repo permanently, which is strictly worse than a red one.
        #
        # Proven, not reasoned: pkg_orbit_orgtree, same probe branch, same
        # pinned reusable ref, 88 seconds apart --
        #   run 32660182877  secrets: { GH_PAT: ... }  -> startup_failure, 0 jobs, 0 check runs
        #   run 32660260878  secrets: inherit          -> success, `analyze / flutter analyze`
        #
        # Every caller on its default branch still passes the explicit map, so
        # this declaration is what makes the migration merge-order-independent:
        # this workflow can land before, after, or between the 19 caller PRs
        # without ever un-reporting a required check. DELETE IT ONLY once all
        # 19 callers are on `secrets: inherit`, in its own PR, with the caller
        # list re-verified live at that moment.
        required: false

permissions:
  contents: read

jobs:
  analyze:
    # Job id `analyze` and job name `flutter analyze` are load-bearing: GitHub
    # reports this to consumers as the context `analyze / flutter analyze`.
    # Renaming either breaks every repo's branch-protection required check.
    name: flutter analyze
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # ── pubspec constraint gates (added 2026-08-26) ──────────────────────────
      #
      # Both run here, before the toolchain installs, because they read one file
      # and need nothing else — a violation costs ~2s instead of a Flutter setup.
      #
      # WHY THESE EXIST, from the incident that produced them:
      # pkg_orbit_nearyest declared `mapbox_maps_flutter: ^3.0.0-alpha.1`
      # (commit 3c37cd9, PR #8, 2026-07-07). It commits no pubspec.lock, so its
      # own CI re-resolved that range to 3.0.0-alpha.28 while main_org_orbit
      # built alpha.1 from its committed lock. alpha.28 made MapboxMap extend
      # StyleManager and deprecated `.style`; alpha.1 did not. Commit 66cda62
      # retyped one declaration from `_map!.style` to `_map!` — green under
      # `analyze / flutter analyze` HERE, and a compile break on five unchanged
      # call sites in the host. Both Japa lanes went red.
      #   incident + forensics: main_org_orbit#373   fix: pkg_orbit_nearyest#54
      #
      # SCOPE, deliberately: the repo-root pubspec.yaml only. Vendored manifests
      # under plugin/ (pkg_orbit_japa ships two) are third-party sources this repo
      # does not author, and are not what it publishes.
      #
      # NOT FLAGGED, and each for a reason, not an oversight:
      #   * `^x.y.z`     — a caret ALREADY carries an upper bound in Dart semver
      #                    (`^1.2.3` == `>=1.2.3 <2.0.0`). Flagging it would be a
      #                    false positive on nearly every line in the fleet.
      #   * `environment:` — an unbounded `flutter: ">=3.24.3"` there is the
      #                    idiomatic Dart form, not a defect. Five repos have it.
      #                    Hence the section filter; a plain grep cannot make this
      #                    distinction and would red those five on day one.
      #   * `path:` deps — resolve out of THIS checkout, so they cannot drift
      #                    between this CI and a consumer. Not the failure class.
      #   * git deps carrying `ref:` — all 13 pkg_* track `ref: cwb` by ratified
      #                    decision (2026-07-27, SHA pins removed). A git dep with
      #                    NO ref at all is a different thing and IS flagged.
      #
      # KNOWN CEILING: two text scans, not a resolver. A `hosted:`-block dep whose
      # constraint sits on a nested `version:` line is not read, and neither is a
      # transitive constraint — nearyest#54 records that bounding the mapbox facade
      # left its three federated implementation packages still on `^3.0.0-alpha.1`,
      # which only a real solve can see. Upgrade path if that bites: a committed
      # pubspec.lock plus a lock-diff gate.
      #
      # NOT A DUPLICATE of reusable-consolidated-gates.yml's "Exact-pin check"
      # (standing invariant 1, checked before writing these): that one hard-fails
      # only on exact `sdk:`/`flutter:` pins inside `environment:`, the one section
      # both steps below skip, and its warn tier is about EXACT pins where these are
      # about OPEN ones. No line can be flagged by both.
      #
      # Both steps are pinned BY NAME in scripts/gate_selftest.py against real
      # pass/fail fixtures. Renaming either reds the harness.
      - name: Dependency upper-bound check
        run: |
          set -euo pipefail
          test -f pubspec.yaml || { echo "::error::no pubspec.yaml at the repo root"; exit 1; }
          awk '
          function flush() {
            if (dep != "" && git && !ref) {
              printf "pubspec.yaml:%d: %s: git dependency with no ref: — resolves whatever the default branch tip is at build time\n", dline, dep
              bad = 1
            }
            dep = ""; git = 0; ref = 0
          }
          /^[^ \t#]/ { flush(); sec = $0; sub(/:.*/, "", sec); next }
          sec !~ /^(dependencies|dev_dependencies|dependency_overrides)$/ { next }
          /^  [^ \t#]/ {
            flush()
            line = $0; sub(/[ \t]*#.*/, "", line)
            if (line !~ /^  [A-Za-z_][A-Za-z0-9_]*:/) next
            name = line; sub(/^  /, "", name); sub(/:.*/, "", name)
            val  = line; sub(/^  [A-Za-z_][A-Za-z0-9_]*:[ \t]*/, "", val)
            gsub(/[ \t]+$/, "", val); gsub(/^["]|["]$/, "", val); gsub(/^'"'"'|'"'"'$/, "", val)
            if (val == "") { dep = name; dline = NR; next }
            if (val == "any") {
              printf "pubspec.yaml:%d: %s: any — accepts every published version, present and future\n", NR, name
              bad = 1
            } else if (val ~ /(^|[ ,])>=?[0-9]/ && val !~ /</) {
              printf "pubspec.yaml:%d: %s: %s — lower bound with no < upper bound\n", NR, name, val
              bad = 1
            }
            next
          }
          /^ +/ { if (dep != "") { if ($0 ~ /^    git:/) git = 1; if ($0 ~ /^ +ref:/) ref = 1 } }
          END { flush(); if (bad) exit 1 }
          ' pubspec.yaml || {
            echo "::error::ERROR: unbounded dependency constraint in pubspec.yaml. A constraint with no upper bound lets this package resolve a version its consumer never built against. Give it an explicit upper bound (a caret, or a < clause), or pin the git dependency with a ref."
            exit 1
          }
          echo "OK: every dependency constraint has an upper bound."
      # The allowlist is INLINE here, in purpusgit/.github, and not a file in the
      # calling repo — on purpose. A per-caller allowlist would let the repo that
      # introduces the pin also grant it, which is not a review. Adding a line
      # means a PR against this workflow, which is the control.
      #
      # Entries are matched WHOLE: "name constraint", not name alone. That is what
      # makes this catch the actual incident — mapbox IS allowlisted today, at the
      # single bounded alpha the host builds, so widening it back to the unbounded
      # `^3.0.0-alpha.1` that caused main_org_orbit#373 still reds.
      - name: Pre-release allowlist check
        run: |
          set -euo pipefail
          test -f pubspec.yaml || { echo "::error::no pubspec.yaml at the repo root"; exit 1; }
          # Reviewed pre-release pins. pkg_orbit_nearyest#54, ratified 2026-08-10.
          ALLOWLIST='mapbox_maps_flutter >=3.0.0-alpha.1 <3.0.0-alpha.2
          mapbox_maps_flutter_platform_interface >=3.0.0-alpha.1 <3.0.0-alpha.2
          mapbox_maps_flutter_mobile >=3.0.0-alpha.1 <3.0.0-alpha.2
          mapbox_maps_flutter_web >=3.0.0-alpha.1 <3.0.0-alpha.2'
          printf '%s\n' "$ALLOWLIST" > "${RUNNER_TEMP:-/tmp}/prerelease-allowlist.txt"
          awk -v allow="${RUNNER_TEMP:-/tmp}/prerelease-allowlist.txt" '
          BEGIN {
            while ((getline l < allow) > 0) {
              gsub(/[ \t]+/, " ", l); gsub(/^ | $/, "", l)
              if (l != "") ok[l] = 1
            }
          }
          /^[^ \t#]/ { sec = $0; sub(/:.*/, "", sec); next }
          sec !~ /^(dependencies|dev_dependencies|dependency_overrides)$/ { next }
          /^  [^ \t#]/ {
            line = $0; sub(/[ \t]*#.*/, "", line)
            if (line !~ /^  [A-Za-z_][A-Za-z0-9_]*:/) next
            name = line; sub(/^  /, "", name); sub(/:.*/, "", name)
            val  = line; sub(/^  [A-Za-z_][A-Za-z0-9_]*:[ \t]*/, "", val)
            gsub(/["]/, "", val); gsub(/'"'"'/, "", val)
            gsub(/[ \t]+/, " ", val); gsub(/^ | $/, "", val)
            if (val !~ /[0-9]+\.[0-9]+\.[0-9]+-[0-9A-Za-z]/) next
            if ((name " " val) in ok) next
            printf "pubspec.yaml:%d: %s: %s — pre-release constraint not in the reviewed allowlist\n", NR, name, val
            bad = 1
          }
          END { if (bad) exit 1 }
          ' pubspec.yaml || {
            echo "::error::ERROR: un-allowlisted pre-release dependency in pubspec.yaml. A pre-release channel keeps publishing under the same range, so this package can resolve a build its consumer never saw (pkg_orbit_nearyest / mapbox_maps_flutter, main_org_orbit#373). Pin it to a single pre-release and add the exact name-and-constraint line to the allowlist in reusable-flutter-analyze.yml by PR."
            exit 1
          }
          echo "OK: no un-allowlisted pre-release dependency."
      # Credential migrated 2026-08-24. GH_PAT lost its permission on
      # purpusgit/pkg_orbit_client_core between 23:02:57 and 23:33:43 on
      # 2026-08-22, taking `analyze / flutter analyze` red on every caller
      # that has a private sibling dependency.
      #
      # It did NOT expire -- the first draft of this comment said it had, and
      # that was wrong. The failing runs all print, byte for byte:
      #     remote: Write access to repository not granted.
      #     fatal: ... The requested URL returned error: 403
      # An expired, revoked, or empty credential cannot produce that. Reproduced
      # locally against this very repo:
      #     empty / bogus credential  -> 401 remote: Invalid username or token.
      #     valid token, repo not granted to it -> 404 remote: Repository not found.
      #     valid token, repo granted, permission too low -> 403 remote: Write
      #                                access to repository not granted.  <-- match
      # So GH_PAT still authenticates and can still SEE the repo; its grant on
      # that one repo is no longer sufficient. Rotating it would not have
      # helped. Migrating off it does, and retires the failure class with it:
      # an App installation token is minted per run and expires in ~1hr, so
      # there is nothing left to expire, revoke, or narrow.
      #
      # CALLER CONTRACT: this workflow no longer READS GH_PAT (it still
      # declares it, see above). Every caller should move to `secrets: inherit`
      # -- verified against GitHub's own docs
      # (Reuse workflows > Using inputs and secrets in a reusable workflow):
      # a workflow_call reusable workflow has NO ambient access to org
      # secrets and cannot see anything the caller does not explicitly pass
      # or inherit. `owner: purpusgit` with no `repositories:` filter mints a
      # token scoped to every repo orbit-sessions-bot's installation covers --
      # deliberately broader than a single-repo scope, because this workflow
      # is called by ~19 different packages whose private sibling
      # dependencies differ per caller and are not knowable here.
      - name: Mint a short-lived installation token
        id: app-token
        # continue-on-error so the guard below owns the failure. Without it the
        # action aborts the job on its own generic "input required" error and
        # the actionable message never prints -- which matters most during the
        # transition, when a caller still on the explicit GH_PAT map reaches
        # here with no app-id and needs to be told exactly that.
        continue-on-error: true
        uses: actions/create-github-app-token@v2
        with:
          app-id: ${{ secrets.ORBIT_BOT_APP_ID }}
          private-key: ${{ secrets.ORBIT_BOT_PRIVATE_KEY }}
          owner: purpusgit
          # @v2 is load-bearing: @v1 DECLARES every `permission-*` input and then
          # silently ignores it -- no error, no warning, and the runner still echoes
          # the input back, so a broken mint's log is identical to a working one's.
          # Measured: v1 -> create-ref 201, v2 -> 403. Do not downgrade the pin.
          permission-contents: read
      - name: Configure git for private org repos
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
        run: |
          set -euo pipefail
          if [ -z "${GH_TOKEN:-}" ]; then
            echo "::error::No installation token was minted. Check the org secrets ORBIT_BOT_APP_ID / ORBIT_BOT_PRIVATE_KEY, that orbit-sessions-bot is installed on this repo, and that the calling workflow passed secrets: inherit (a bare secrets: { GH_PAT: ... } map still starts the run but supplies nothing this workflow reads -- switch that caller to secrets: inherit). dart pub get cannot clone private siblings without it -- failing loudly instead of falling through to an anonymous fetch."
            exit 1
          fi
          git config --global url."https://x-access-token:${GH_TOKEN}@github.com/".insteadOf "git@github.com:"
          git config --global --add url."https://x-access-token:${GH_TOKEN}@github.com/".insteadOf "https://github.com/"
      - uses: subosito/flutter-action@v2
        with:
          flutter-version-file: .fvmrc
          channel: stable
          cache: true
      - run: dart pub get --no-example
      # Behaviourally tested by scripts/gate_selftest.py, which pins this step
      # BY NAME. Renaming it reds the harness rather than silently dropping the
      # only fixture-backed assertion this gate has.
      - name: Analyze (lib only)
        run: flutter analyze lib/ --no-fatal-infos --no-pub

      # ── Rule 88 web build (opt-in) ──────────────────────────────────────────
      # Predicate carried over verbatim from the two flutter-web-build.yml files this
      # replaces. japa's explicitly ran `flutter pub get` in example/ before building
      # and then asserted main.dart.js exists; client_core's relied on the implicit
      # pub get and asserted nothing. Both are kept — the union is the STRONGER of the
      # two on each axis, never the weaker, so neither repo loses a check.
      #
      # `.fvmrc` (from the flutter-action step above) is now the version for both.
      # japa's standalone file hardcoded `flutter-version: '3.41.9'`; its .fvmrc says
      # 3.41.9 too, so this is a like-for-like move today AND removes the exact pin
      # that would have drifted at the next toolchain bump.
      - name: pub get (example)
        if: ${{ inputs.run_web_build }}
        working-directory: example
        run: flutter pub get

      - name: flutter build web --release (example)
        if: ${{ inputs.run_web_build }}
        working-directory: example
        run: flutter build web --release

      - name: Confirm bundle produced
        if: ${{ inputs.run_web_build }}
        working-directory: example
        run: |
          test -f build/web/main.dart.js || { echo "::error::dart2js produced no main.dart.js"; exit 1; }
          echo "web bundle OK ($(du -h build/web/main.dart.js | cut -f1))"

