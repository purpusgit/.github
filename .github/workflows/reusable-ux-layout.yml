name: Reusable — ux-layout (a layout blunder we already fixed blocks the PR)

# Founder, 14 Nov 2026: "Nobody should be able to repeat an error we already fixed." This fails a pull request that ADDS,
# in lib/**.dart: PageContentWidth( without kind: (W2), a hard-coded non-zero padding: on it (W3, the double gutter), a raw
# BoxConstraints(maxWidth:) cap in a screen (W1), outlineVariant on a text-field border (W10), ScreenUtil in a *_web.dart
# file (W11), ScreenUtil.init outside pkg_orbit_binder (W12), or a debug-only control with no kDebugMode (DBG).
# Today's code passes until someone touches the line. A deliberate exception carries `// layout-ok: <why>` on the line or
# the line above it. Logic and tests: scripts/ux_layout.py, scripts/test_ux_layout.py (a step of self-test-gates.yml).
#
#   ux-layout:
#     if: ${{ github.event_name == 'pull_request' }}
#     uses: purpusgit/.github/.github/workflows/reusable-ux-layout.yml@main
#     # no inputs needed: it diffs against the PR's own base branch (cwb, master, sandbox ...).
#     # base_ref overrides that, and falls back to cwb only when there is no PR base (workflow_dispatch).
#
# It FAILS the check on any finding, so a caller makes it required deliberately. It exits 2 (also a failure) when the diff
# cannot be computed: it never passes on an unreadable input. Safe for PRs: no step runs PR code, and the script comes from
# this repo's main, so a PR cannot change the rules that judge it. It needs no secret.

on:
  workflow_call:
    inputs:
      base_ref:
        description: >-
          Override the branch to diff against. Empty (the default) means the PR's own base branch, so a PR into
          master or sandbox is judged against master or sandbox, not against cwb. Only a run with no PR base
          (workflow_dispatch) falls back to cwb.
        required: false
        type: string
        default: ''

permissions:
  contents: read

jobs:
  ux-layout:
    runs-on: orbit-ci-light   # python3 and git only
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # the base...HEAD diff needs the merge base

      - name: Fetch the ux-layout script from purpusgit/.github main
        uses: actions/checkout@v4
        with:
          repository: purpusgit/.github
          ref: main
          path: .ux-layout-src
          sparse-checkout: scripts/ux_layout.py
          sparse-checkout-cone-mode: false

      - name: ux-layout — no layout blunder added
        env:
          BASE: ${{ inputs.base_ref || github.base_ref || 'cwb' }}
        run: |
          set -euo pipefail
          git fetch -q origin "$BASE"
          BASE_REF="origin/$BASE" python3 -I .ux-layout-src/scripts/ux_layout.py
