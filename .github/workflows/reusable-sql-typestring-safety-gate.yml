name: Reusable — SQL taxo Type-String Safety Gate

# Enforces TypeScript_Backend_Coding_Rules.md §SQL Template Literal Discipline #2:
# taxo.master type strings are lowercase since Rule 59 (2026-05-16). A PascalCase
# type like 'Org_Department' returns 0 rows silently — tsc exits 0, CI is green,
# the endpoint returns NULL at runtime only.
#
# PR mode (default): diff-only — flags PascalCase type strings on ADDED lines only,
# against the PR base. Pre-existing violations never block unrelated work, so this
# gate is safe to wire on any repo without a prior full-repo clean-up (mirrors the
# colours gate's added-lines discipline).
# Scheduled/audit mode (full_scan: true): scans the whole src tree and reports every
# violation — for a nightly legacy-debt inventory, not per-PR blocking.
#
# ⚠️ GLOB INVARIANT — do not "helpfully" widen this. This gate has NO context-gating:
# it greps `type = 'PascalCase'` in every scanned file, so its safety is ENTIRELY a
# property of the glob being SQL-only file types (*.sql.ts, and *.sql if ever added).
# Broadening the glob to *.ts (or any non-SQL type) without adding context-gating
# recreates the spec-file false-positive class (proven: `const type = 'Fixture_Type'`
# in a test file). Broader / inline-SQL-in-.ts surfaces are owned by
# reusable-taxo-lint.yml, which IS taxo.master-context-gated. Keep the two gates,
# two scopes; do not merge them here.

on:
  workflow_call:
    inputs:
      base_ref:
        description: 'Base branch to diff against. Empty = the PR base, then the repo default branch.'
        required: false
        type: string
        default: ''
      full_scan:
        description: 'Scan the whole src tree instead of the PR diff (scheduled audit).'
        required: false
        type: boolean
        default: false

jobs:
  sql-typestring-gate:
    runs-on: ubuntu-latest
    name: SQL taxo.master type-string check (Rule 58/59)
    steps:
      - uses: actions/checkout@v5.1.0
        with:
          fetch-depth: 0
      - name: Check for PascalCase taxo.master type strings
        run: |
          set -uo pipefail
          PAT="type[[:space:]]*=[[:space:]]*'[A-Z][A-Za-z0-9_]*'"
          FAIL=0
          if [ "${{ inputs.full_scan }}" = "true" ]; then
            # Audit mode — whole tree. grep -n here numbers real file lines.
            files=$( { find src -type f -name '*.sql.ts'; find src -type f -name '*.sql.v[0-9]*.ts'; } 2>/dev/null | sort -u )
            for f in $files; do
              [ -f "$f" ] || continue
              HITS=$(grep -nE "$PAT" "$f" | grep -v 'intentional:' || true)
              if [ -n "$HITS" ]; then
                echo "::error file=$f::PascalCase taxo.master type string (Rule 58/59) — taxo.master types are lowercase; a PascalCase value returns 0 rows silently (tsc green, NULL at runtime)."
                echo "$HITS" | sed "s|^|  $f:|"
                FAIL=1
              fi
            done
          else
            # PR mode — added lines only, against the PR base branch.
            BASE_REF="${{ inputs.base_ref }}"
            [ -z "$BASE_REF" ] && BASE_REF="${{ github.base_ref }}"
            [ -z "$BASE_REF" ] && BASE_REF="${{ github.event.repository.default_branch }}"
            git fetch origin "$BASE_REF" --depth=1 2>/dev/null || true
            # Never pass vacuously: if the base ref can't be resolved, RED — do not
            # let a swallowed diff error print "gate passed" (silent-pass / vacuous-gate).
            if ! git rev-parse --verify --quiet "origin/${BASE_REF}" >/dev/null; then
              echo "::error::sql-typestring gate could not resolve base ref origin/${BASE_REF} — refusing to pass without diffing."
              exit 1
            fi
            CHANGED=$(git diff "origin/${BASE_REF}...HEAD" --name-only -- '*.sql.ts' | sort -u)
            if [ -z "$CHANGED" ]; then
              echo "No changed *.sql.ts against origin/${BASE_REF}. Gate passed."
              exit 0
            fi
            while IFS= read -r f; do
              [ -f "$f" ] || continue
              # Added lines only (git diff '+' lines, minus the +++ header). grep without
              # -n here: the added-line stream has no file line numbers, so -n would
              # mislabel. The ::error names the file; the printed line shows the offender.
              ADDED=$(git diff "origin/${BASE_REF}...HEAD" -- "$f" | grep '^+' | grep -v '^+++')
              HITS=$(echo "$ADDED" | grep -E "$PAT" | grep -v 'intentional:' || true)
              if [ -n "$HITS" ]; then
                echo "::error file=$f::PascalCase taxo.master type string ADDED (Rule 58/59) — taxo.master types are lowercase; a PascalCase value returns 0 rows silently."
                echo "$HITS"
                FAIL=1
              fi
            done <<< "$CHANGED"
          fi
          if [ "$FAIL" -eq 1 ]; then
            echo ""
            echo "Fix: lowercase the type string, or verify the exact value against live taxo.master."
            echo "Suppress a verified-correct hit with a '// intentional:' comment on the same line."
            echo "See: TypeScript_Backend_Coding_Rules.md SQL Template Literal Discipline #2 (Rule 58/59)."
            exit 1
          fi
          echo "SQL taxo type-string gate passed."
