name: Reusable — Host Pin Auto-Bump (pkg_* push -> host pubspec SHA roll)

# Called BY each internal pkg_* repo on push to `cwb`. Rewrites the matching
# dependency_overrides `ref:` in the host app (main_org_orbit) pubspec.yaml to
# the pushed HEAD SHA, regenerates pubspec.lock with `flutter pub get`, and
# opens/updates ONE PR titled `chore(deps): bump <pkg> to <short-sha>`.
#
# Why: a merged package PR is invisible to host builds until its pinned SHA is
# bumped and pubspec.lock is regenerated (Flutter_Upgrade_Readiness A7 — pub
# never re-resolves a branch ref; the lock's resolved-ref wins). This automates
# the roll. The checkout/rewrite/pub-get/PR steps mirror lock-refresh.yaml.
#
# Thin caller (pkg_*/.github/workflows/host-pin-autobump.yml):
#   on: { push: { branches: ['cwb'] } }
#   jobs:
#     bump-host:
#       uses: purpusgit/.github/.github/workflows/reusable-host-pin-autobump.yml@main
#       with:
#         package: pkg_orbit_japa          # override key or repo name
#         new_sha: ${{ github.sha }}
#       secrets:
#         GIT_PASSWORD: ${{ secrets.GIT_PASSWORD }}
#
# NOTE: this opens a PR against the host — it never merges. The host's
# reusable-host-pin-integrity gate + web-build CI + founder review still apply
# (Rule 74 / Rule 78). A green auto-bump PR awaits founder unlock.

on:
  workflow_call:
    inputs:
      package:
        description: "Override key or repo name to bump (e.g. pkg_orbit_japa / orbit_japa)."
        required: true
        type: string
      new_sha:
        description: "New 40-char commit SHA (usually the caller's github.sha)."
        required: true
        type: string
      host_repo:
        description: "Host app repo that carries the pins."
        default: "main_org_orbit"
        type: string
      host_branch:
        description: "Host branch to bump the pin on (PR base)."
        default: "cwb"
        type: string
      pubspec_path:
        description: "Path to the host pubspec.yaml."
        default: "pubspec.yaml"
        type: string
      gate_ref:
        description: "Ref of purpusgit/.github to fetch the bump script from."
        default: "main"
        type: string
    secrets:
      GIT_PASSWORD:
        description: >-
          PAT with write access to the host repo. Used to check it out, rewrite
          SSH->HTTPS for `flutter pub get`, push the bump branch, and open the PR.
          NOT the caller GITHUB_TOKEN — a PR opened with GITHUB_TOKEN does not
          trigger the host's web-build CI (same reason as lock-refresh.yaml).
        required: true

permissions:
  contents: read

jobs:
  autobump:
    runs-on: ubuntu-latest
    name: bump host pin -> ${{ inputs.package }}
    steps:
      - name: Checkout host app (${{ inputs.host_repo }}@${{ inputs.host_branch }})
        uses: actions/checkout@v5.1.0
        with:
          repository: purpusgit/${{ inputs.host_repo }}
          ref: ${{ inputs.host_branch }}
          token: ${{ secrets.GIT_PASSWORD }}

      - name: Fetch host_pin_integrity.py from purpusgit/.github
        uses: actions/checkout@v5.1.0
        with:
          repository: purpusgit/.github
          ref: ${{ inputs.gate_ref }}
          path: gate
          token: ${{ secrets.GIT_PASSWORD }}

      - name: Set up Python
        uses: actions/setup-python@v6.3.0
        with:
          python-version: "3.11"

      - name: Rewrite the override ref
        id: bump
        run: |
          set -euo pipefail
          python gate/scripts/host_pin_integrity.py bump \
            --pubspec "${{ inputs.pubspec_path }}" \
            --package "${{ inputs.package }}" \
            --sha "${{ inputs.new_sha }}" \
            --write
          if git diff --quiet -- "${{ inputs.pubspec_path }}"; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "::notice::Pin already at ${{ inputs.new_sha }} — nothing to bump."
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Set up Flutter
        if: steps.bump.outputs.changed == 'true'
        uses: subosito/flutter-action@v2
        with:
          flutter-version-file: '.fvmrc'   # never hardcode the version

      - name: Rewrite SSH git deps to HTTPS (private purpusgit packages)
        if: steps.bump.outputs.changed == 'true'
        run: |
          git config --global url."https://${{ secrets.GIT_PASSWORD }}@github.com/".insteadOf "git@github.com:"

      - name: flutter pub get (regenerate pubspec.lock)
        if: steps.bump.outputs.changed == 'true'
        run: flutter pub get

      - name: Open or update the bump PR
        if: steps.bump.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ secrets.GIT_PASSWORD }}
        run: |
          set -euo pipefail
          SHORT="$(echo "${{ inputs.new_sha }}" | cut -c1-8)"
          BR="chore/host-pin-bump-${{ inputs.package }}"
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -B "$BR"
          git add "${{ inputs.pubspec_path }}" pubspec.lock
          git commit -m "chore(deps): bump ${{ inputs.package }} to ${SHORT}"
          git push -f -u origin "$BR"
          printf '%s\n' \
            "Automated by the host-pin auto-bump reusable workflow." \
            "" \
            "Rolls \`${{ inputs.package }}\` to \`${{ inputs.new_sha }}\` and regenerates" \
            "pubspec.lock via \`flutter pub get\` on a runner (not a hand-edit)." \
            "" \
            "The host web-build CI + host-pin integrity gate + founder review still" \
            "apply — this PR is not auto-merged (Rule 74 / Rule 78)." \
            > /tmp/pr_body.md
          if gh pr view "$BR" --json number >/dev/null 2>&1; then
            echo "::notice::PR for $BR already open — branch updated (force-push)."
          else
            gh pr create --base "${{ inputs.host_branch }}" --head "$BR" \
              --title "chore(deps): bump ${{ inputs.package }} to ${SHORT}" \
              --body-file /tmp/pr_body.md
          fi
