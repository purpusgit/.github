name: UX required checks (org ruleset, standalone)

# GIT-01: an org ruleset "required workflow" must be a standalone workflow in this repo with `on: pull_request` and no inputs;
# a `workflow_call` reusable cannot be the ruleset target. This file is that target for the UX gates. The reusable workflows
# (reusable-ux-layout.yml and friends) stay for per-repo branch-protection callers; scripts/test_ux_layout.py asserts that
# this file and the reusable run the SAME script, fetched the same way, with the same base.
#
# The JOB NAMES are the required contexts, so keep them stable: `ux-layout`, `ux-one-template`, `seeded-and-seen` and `http-headers`.
# Each job no-ops (passes in seconds) in a repo with no pubspec.yaml, so a ruleset can cover every repo without a Flutter list.
# The base is the PR's own base branch (github.base_ref). No step runs PR code, the script comes from this repo's main, and
# no secret is needed.

on:
  pull_request:
    # `reopened`: without it a closed-and-reopened PR never reports a required check. `labeled`, `unlabeled`, `ready_for_review`
    # and `converted_to_draft` are for seeded-and-seen (a label, a body edit or leaving draft re-runs it); the other jobs
    # recompute the same answer on those events, they never skip, so a stale red cannot be masked by a skipped re-run.
    types: [opened, synchronize, edited, reopened, labeled, unlabeled, ready_for_review, converted_to_draft]

permissions:
  contents: read

jobs:
  ux-layout:
    runs-on: orbit-ci-light   # python3 and git only
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # the base...HEAD diff needs the merge base

      - name: Is this a Flutter repo?
        id: flutter
        run: |
          if [ -f pubspec.yaml ]; then echo "yes=true" >> "$GITHUB_OUTPUT"; else echo "yes=false" >> "$GITHUB_OUTPUT"; echo "No pubspec.yaml: ux-layout does not apply."; fi

      - name: Fetch the ux-layout script from purpusgit/.github main
        if: ${{ steps.flutter.outputs.yes == 'true' }}
        uses: actions/checkout@v4
        with:
          repository: purpusgit/.github
          ref: main
          path: .ux-layout-src
          sparse-checkout: scripts/ux_layout.py
          sparse-checkout-cone-mode: false

      - name: ux-layout — no layout blunder added
        if: ${{ steps.flutter.outputs.yes == 'true' }}
        env:
          BASE: ${{ github.base_ref || 'cwb' }}
        run: |
          set -euo pipefail
          git fetch -q origin "$BASE"
          BASE_REF="origin/$BASE" python3 -I .ux-layout-src/scripts/ux_layout.py

  ux-one-template:
    runs-on: orbit-ci-light   # python3 and git only
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # the base...HEAD diff needs the merge base

      - name: Is this a Flutter repo?
        id: flutter
        run: |
          if [ -f pubspec.yaml ]; then echo "yes=true" >> "$GITHUB_OUTPUT"; else echo "yes=false" >> "$GITHUB_OUTPUT"; echo "No pubspec.yaml: ux-one-template does not apply."; fi

      - name: Fetch the script and its allowlist from purpusgit/.github main
        if: ${{ steps.flutter.outputs.yes == 'true' }}
        uses: actions/checkout@v4
        with:
          repository: purpusgit/.github
          ref: main
          path: .ux-one-template-src
          sparse-checkout: |
            scripts/ux_one_template.py
            scripts/ux_one_template_allowlist.txt
          sparse-checkout-cone-mode: false

      - name: ux-one-template — no second app frame added
        if: ${{ steps.flutter.outputs.yes == 'true' }}
        env:
          BASE: ${{ github.base_ref || 'cwb' }}
        run: |
          set -euo pipefail
          git fetch -q origin "$BASE"
          BASE_REF="origin/$BASE" python3 -I .ux-one-template-src/scripts/ux_one_template.py

  seeded-and-seen:
    # No checkout of PR code: the body, labels and draft flag come from the event payload, the changed files from the API.
    # A repo with no screen or widget file in the PR is a one-line "not applicable" pass. The account pattern is per repo:
    # set the repo (or org) variable SEEDED_TEST_ACCOUNT_PATTERN; the default is JAPA_TEST_[A-Z0-9_]+.
    runs-on: orbit-ci-light   # python3 and the API only
    timeout-minutes: 10
    permissions:
      contents: read
      pull-requests: read
    steps:
      - name: Fetch the seeded-and-seen script from purpusgit/.github main
        uses: actions/checkout@v4
        with:
          repository: purpusgit/.github
          ref: main
          path: .seeded-and-seen-src
          sparse-checkout: scripts/seeded_and_seen.py
          sparse-checkout-cone-mode: false

      - name: seeded-and-seen — a UI PR names its test accounts, build, seeded ids and a picture per state
        env:
          GH_TOKEN: ${{ github.token }}
          TEST_ACCOUNT_PATTERN: ${{ vars.SEEDED_TEST_ACCOUNT_PATTERN || 'JAPA_TEST_[A-Z0-9_]+' }}
        run: python3 -I .seeded-and-seen-src/scripts/seeded_and_seen.py

  http-headers:
    runs-on: orbit-ci-light   # python3 and git only
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # the base...HEAD diff needs the merge base

      - name: Is this a Flutter repo?
        id: flutter
        run: |
          if [ -f pubspec.yaml ]; then echo "yes=true" >> "$GITHUB_OUTPUT"; else echo "yes=false" >> "$GITHUB_OUTPUT"; echo "No pubspec.yaml: http-headers does not apply."; fi

      - name: Fetch the http-headers script from purpusgit/.github main
        if: ${{ steps.flutter.outputs.yes == 'true' }}
        uses: actions/checkout@v4
        with:
          repository: purpusgit/.github
          ref: main
          path: .http-headers-src
          sparse-checkout: scripts/http_headers.py
          sparse-checkout-cone-mode: false

      - name: http-headers — no header set to a value that is not provably ISO-8859-1
        if: ${{ steps.flutter.outputs.yes == 'true' }}
        env:
          BASE: ${{ github.base_ref || 'cwb' }}
          HTTP_HEADERS_EXEMPT: ${{ vars.HTTP_HEADERS_EXEMPT }}
          HTTP_HEADERS_ASCII_NAMES: ${{ vars.HTTP_HEADERS_ASCII_NAMES }}
        run: |
          set -euo pipefail
          git fetch -q origin "$BASE"
          BASE_REF="origin/$BASE" python3 -I .http-headers-src/scripts/http_headers.py
