name: Reusable — notify a specs inbox when a run ends

# A dispatched build or deploy belongs to no PR, so nothing wakes the seat that started it.
# A caller adds an optional `notify_inbox` input and one last job:
#
#   notify:
#     needs: [web]
#     if: ${{ always() && inputs.notify_inbox != '' }}
#     uses: purpusgit/.github/.github/workflows/reusable-notify-inbox.yml@main
#     with:
#       inbox: ${{ inputs.notify_inbox }}
#       results: ${{ join(needs.*.result, ' ') }}
#     secrets: inherit
#
# It posts one line on that specs PR as the bot (the comment wakes its subscriber, WAKE-POST-1):
# workflow, run link, conclusion, head sha, and an optional note (e.g. the roll PR's link).
#
# `dedupe_key` (optional, [A-Za-z0-9._:-]): a repeating alarm sets it so one condition posts once, not every run. The comment
# then ends with a hidden `<!-- notify:KEY -->` marker, and a run first reads the inbox's comments of the last `dedupe_hours`
# (default 6) and posts nothing if one carries the same marker. Empty (the default): every run posts, as before.

on:
  workflow_call:
    inputs:
      inbox:   { required: true, type: string }                  # specs PR number of the seat's inbox
      results: { required: true, type: string }                  # space-separated needs.*.result
      note:    { required: false, type: string, default: '' }
      dedupe_key:   { required: false, type: string,  default: '' }
      dedupe_hours: { required: false, type: number,  default: 6 }
    secrets:
      ORBIT_BOT_APP_ID:      { required: false }
      ORBIT_BOT_PRIVATE_KEY: { required: false }

permissions: {}

jobs:
  notify:
    runs-on: orbit-ci-light
    timeout-minutes: 5
    steps:
      - name: Token for the specs inbox
        id: token
        uses: actions/create-github-app-token@v2
        with:
          app-id: ${{ secrets.ORBIT_BOT_APP_ID }}
          private-key: ${{ secrets.ORBIT_BOT_PRIVATE_KEY }}
          owner: purpusgit
          repositories: specs
          permission-issues: write
          permission-pull-requests: write   # inboxes are PRs; commenting on a PR needs this, issues: write alone gets 403

      - name: Post one line
        env:
          GH_TOKEN: ${{ steps.token.outputs.token }}
          INBOX: ${{ inputs.inbox }}
          RESULTS: ${{ inputs.results }}
          NOTE: ${{ inputs.note }}
          DEDUPE_KEY: ${{ inputs.dedupe_key }}
          DEDUPE_HOURS: ${{ inputs.dedupe_hours }}
          WORKFLOW: ${{ github.workflow }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          SHA: ${{ github.sha }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          case "$INBOX" in ''|*[!0-9]*) echo "::error::inbox must be a specs PR number, got '$INBOX'"; exit 1;; esac
          # failure beats cancelled beats success; skipped jobs alone count as success
          case " $RESULTS " in *" failure "*) c=failure;; *" cancelled "*) c=cancelled;; *) c=success;; esac
          body="**${WORKFLOW}** (${REPO}): **${c}**, head \`${SHA:0:7}\`, run ${RUN_URL}"
          [ -n "$NOTE" ] && body="$body · $NOTE"
          if [ -n "$DEDUPE_KEY" ]; then
            case "$DEDUPE_KEY" in *[!A-Za-z0-9._:-]*) echo "::error::dedupe_key may only hold letters, digits and . _ : -"; exit 1;; esac
            case "$DEDUPE_HOURS" in ''|*[!0-9]*) echo "::error::dedupe_hours must be a whole number"; exit 1;; esac
            marker="<!-- notify:${DEDUPE_KEY} -->"
            since=$(date -u -d "-${DEDUPE_HOURS} hours" +%Y-%m-%dT%H:%M:%SZ)
            page=1
            while [ "$page" -le 10 ]; do
              curl -fsS -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" \
                "https://api.github.com/repos/purpusgit/specs/issues/$INBOX/comments?since=${since}&per_page=100&page=${page}" > "$RUNNER_TEMP/comments.json"
              r=$(python3 -I -c 'import json,sys;d=json.load(open(sys.argv[1]));print(len(d), int(any(sys.argv[2] in (c.get("body") or "") and c["created_at"] >= sys.argv[3] for c in d)))' "$RUNNER_TEMP/comments.json" "$marker" "$since")
              n=${r% *}; found=${r#* }
              if [ "$found" = 1 ]; then echo "skip: '${DEDUPE_KEY}' was already posted on specs#$INBOX in the last ${DEDUPE_HOURS} h"; exit 0; fi
              [ "$n" -lt 100 ] && break
              page=$((page + 1))
            done
            body="$body"$'\n\n'"$marker"
          fi
          B="$body" python3 -I -c 'import json,os;print(json.dumps({"body":os.environ["B"]}))' > "$RUNNER_TEMP/body.json"
          curl -fsS -X POST -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/purpusgit/specs/issues/$INBOX/comments" --data @"$RUNNER_TEMP/body.json" > /dev/null
          echo "posted on specs#$INBOX: $body"
