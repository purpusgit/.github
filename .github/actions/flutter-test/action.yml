name: Flutter test gate
description: >-
  Run a package's Dart suite. A composite action, not a reusable workflow, on
  purpose: a reusable workflow reports as `<caller job> / <reusable job>`, which
  would rename the `flutter test` check-run context that branch protection keys
  on in eleven packages. A composite action runs inside the caller's own job, so
  the reported name is unchanged.

# ── Why this exists ─────────────────────────────────────────────────────────
# The predicate was copied inline into every package gate, and the copies had
# drifted: pkg_orbit_japa exits 1 when test/ is missing, the other four exit 0.
# One of those is wrong. It lives here now so the next fix lands once.
#
# ── What is red ─────────────────────────────────────────────────────────────
# Everything. No suite is red. A suite that declares nothing is red (exit 79).
# A failing test is red. There is no tolerated case and no `|| true`.
#
# An earlier draft tolerated exit 79 so that packages with stub suites could
# adopt the gate before they had assertions. All eleven consumers now have real
# suites, so the tolerance protected nobody and would have quietly weakened
# pkg_orbit_japa, which has always failed on 79. Removed rather than kept for a
# rollout that is over.

runs:
  using: composite
  steps:
    - name: Test
      shell: bash
      env:
        GH_TOKEN: ${{ github.token }}
      run: |
        set -euo pipefail

        # A full runner disk breaks the Flutter test harness without failing it: a golden or a compiler cache that cannot
        # be written (ENOSPC) leaves `flutter test` printing its last line until a timeout or a human cancel. Check the
        # runner's own mount (not a hard-coded path) first and fail in seconds with a clear message. 5 GB by default;
        # FLUTTER_TEST_MIN_FREE_GB exists for the self-test.
        min_gb="${FLUTTER_TEST_MIN_FREE_GB:-5}"
        read -r avail_k mount < <(df -Pk "${GITHUB_WORKSPACE:-.}" | awk 'NR==2 {k=$4; $1=$2=$3=$4=$5=""; sub(/^ +/, ""); print k, $0}')
        if [ "${avail_k:-0}" -lt $(( min_gb * 1024 * 1024 )) ]; then
          free_gb=$(awk -v k="${avail_k:-0}" 'BEGIN { printf "%.1f", k / 1048576 }')
          echo "::error title=Runner disk full::${free_gb} GB free on ${mount:-unknown} (runner ${RUNNER_NAME:-unknown}); need ${min_gb} GB for a Flutter test run"
          exit 1
        fi

        # Fail here rather than letting `flutter test` fail later, only because
        # the message is clearer. The outcome is the same either way: red.
        if [ ! -d test ] || [ -z "$(find test -name '*_test.dart' -type f -print -quit 2>/dev/null)" ]; then
          echo "::error title=No suite::test/ is missing, or contains no *_test.dart. A package wired to this gate must have a suite."
          exit 1
        fi

        echo "Test files found:"
        find test -name '*_test.dart' -type f | sort

        # LOCAL-ATTEST-1 (specs ci-git/spec-local-test-attestation.md; founder 24-25 Nov: "if the checks are done on
        # Anthropic dockers, we shouldn't duplicate them on our runners"). On a PR whose session posted a matching
        # attestation (same merge tree, SDK, resolved deps, env, suite list), run only a blocking spot-check: the
        # width harness plus 10% of suites at random. Anything else, or any error here, runs the full suite below.
        # pubspec.lock must exist (the caller ran `flutter pub get` first, as every consumer does).
        args=""
        if [ "${GITHUB_EVENT_NAME:-}" = "pull_request" ] && [ -f pubspec.lock ]; then
          att_out="$(mktemp)"
          GITHUB_OUTPUT="$att_out" python3 "$GITHUB_ACTION_PATH/../../../scripts/local_attest.py" ci-check || true
          if grep -q '^skip=true' "$att_out" 2>/dev/null; then
            args="$(python3 "$GITHUB_ACTION_PATH/../../../scripts/local_attest.py" spot-list "${GITHUB_RUN_ID:-0}" || true)"
            if [ -n "$args" ]; then
              echo "LOCAL-ATTEST-1: spot-check of $(echo $args | wc -w) suite files instead of the full suite"
              export TZ="${TZ:-Asia/Kolkata}" LANG=C.UTF-8   # keep a TZ the caller job pins (Japa: UTC)
              : > "${RUNNER_TEMP:-/tmp}/local-attest-spot"   # tells a later "record the tested tree" step not to record
            fi
          fi
        fi

        # A hung `flutter test` (a flutter_tester that never reports) sat for over an hour on self-hosted runners and
        # blocked merges. A composite step cannot take `timeout-minutes`, so the call is wrapped: 30 minutes, then
        # TERM, then KILL after another 60 s. Exit 124 (timed out) and 137 (had to be killed) are a hang and are red
        # with a message that names the runner; any other exit code is flutter's own and passes through unchanged,
        # so a failing test is still a failing test. `timeout` signals the whole process group, which takes the
        # flutter_tester children with it. FLUTTER_TEST_TIMEOUT / FLUTTER_TEST_KILL_AFTER exist for the self-test.
        limit="${FLUTTER_TEST_TIMEOUT:-30m}"
        rc=0
        # The call runs in its own process group (setsid), and after it returns any process still in that group is
        # KILLed. `timeout` alone does not reach a grandchild everywhere: on GitHub-hosted ubuntu-latest a TERM-ignoring
        # child's grandchild survived the KILL and held the step for 300 s (IAC-B01, 22 Nov 2026, .github#150).
        setsid timeout --kill-after="${FLUTTER_TEST_KILL_AFTER:-60s}" "$limit" flutter test --no-pub --reporter compact $args &
        tpg=$!
        wait "$tpg" || rc=$?
        kill -KILL -- "-$tpg" 2>/dev/null || true
        if [ "$rc" -eq 124 ] || [ "$rc" -eq 137 ]; then
          case "$limit" in *m) shown="${limit%m} min" ;; *) shown="$limit" ;; esac
          echo "::error title=flutter test hung::no result after ${shown} (runner ${RUNNER_NAME:-unknown})"
          exit 1
        fi
        exit "$rc"
