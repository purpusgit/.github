name: M34 auth coverage gate
description: >-
  Fail if any route is registered without a verified-identity middleware and
  without an entry in the repo's auth-exceptions.json. Composite, not a reusable
  workflow, on purpose — see below.

# ── Why composite and not a reusable workflow ───────────────────────────────
# A reusable workflow reports as `<caller job> / <reusable job>`, so a caller
# with `jobs.auth-coverage` would produce the context `auth-coverage / auth-coverage`
# instead of `auth-coverage`. Once branch protection keys on the bare name, that
# rename is a required context with no reporter — the check never reports, and
# protection blocks on the ABSENCE, not on a failure. Six package branches sat in
# exactly that state this week. A composite action runs inside the caller's own
# job, so the reported name is whatever the caller's job is called and nothing
# moves underneath protection.
#
# ── What this action does and does not own ──────────────────────────────────
# The predicate below is Session B's, copied verbatim from the converged copy
# (blob e5bac9ab46, after the win32 path-separator fix landed on both branches).
# This action packages it. It does not change its logic, and adopting it does NOT
# fix the open defects in it — those land in the predicate, wherever it lives.

inputs:
  roots:
    description: >-
      Space-separated directories to scan. Repos with more than one API surface
      pass more than one — service_orbit_orgs has src/api (442 registrations)
      and src/api-admin (176), and scanning only the first reports green over
      the admin surface.
    required: false
    default: src/api
  allowlist:
    description: Path to the repo's auth-exceptions.json. Stays per-repo — it is data, not logic.
    required: false
    default: auth-exceptions.json

runs:
  using: composite
  steps:
    - name: Auth coverage
      shell: bash
      run: |
        set -euo pipefail
        for root in ${{ inputs.roots }}; do
          echo "── scanning $root ──"
          node "$GITHUB_ACTION_PATH/check-route-auth-coverage.js" "$root" "${{ inputs.allowlist }}"
        done
