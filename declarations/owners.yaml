# `sandbox` heads: service_orbit_orgs 0095fb33, service_mongo_social 7c4f4c1a, service_inapp_chat 4956cc0c, service_orbit_analytics 244249ea.
# A table created in two repos, or created in one and altered in another, is NOT here (it is listed in the PR for OFFLINE-01).
# master.* and orbit_japa.* have no rows. Every row above this block wins over a generated one. Repo names are the real names;
# the gate compares them with `service_` removed, so `orbit_orgs` and `service_orbit_orgs` are the same owner.
